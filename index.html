<style>
body{margin:0}
img{max-width:100%}

:root{
  --ink:#131c26;--ink-2:#3d4a58;--ink-3:#6b7887;
  --azul:#27578f;--azul-alto:#1c4271;--azul-suave:#eaf0f7;
  --ambar:#e9a12c;--ambar-suave:#fdf4e2;
  --verde:#1f7a4d;--verde-suave:#e7f3ec;
  --rojo:#b03028;--rojo-suave:#fbecea;
  --papel:#f4f6f8;--superficie:#fff;--superficie-2:#fafbfc;
  --linea:#d3dae2;--linea-suave:#e6eaef;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e9edf2;--ink-2:#b3bdc8;--ink-3:#8290a0;
  --azul:#77a8dd;--azul-alto:#a2c5e9;--azul-suave:#1a2836;
  --ambar:#e2a949;--ambar-suave:#2e2413;
  --verde:#5fc08c;--verde-suave:#14291e;
  --rojo:#e58076;--rojo-suave:#2e1917;
  --papel:#0f151c;--superficie:#171f28;--superficie-2:#1b242e;
  --linea:#2f3c49;--linea-suave:#242f3a;
}}
:root[data-theme="dark"]{
  --ink:#e9edf2;--ink-2:#b3bdc8;--ink-3:#8290a0;
  --azul:#77a8dd;--azul-alto:#a2c5e9;--azul-suave:#1a2836;
  --ambar:#e2a949;--ambar-suave:#2e2413;
  --verde:#5fc08c;--verde-suave:#14291e;
  --rojo:#e58076;--rojo-suave:#2e1917;
  --papel:#0f151c;--superficie:#171f28;--superficie-2:#1b242e;
  --linea:#2f3c49;--linea-suave:#242f3a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--ink);
 font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.env{max-width:1080px;margin:0 auto;padding:0 16px;padding-block:24px 60px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.92em}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

header.top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header.top svg{flex:none}
h1{font-size:22px;margin:0;letter-spacing:-.3px;font-weight:700;text-wrap:balance}
.lede{color:var(--ink-3);font-size:13px;margin:3px 0 0}
.sello{margin-left:auto;text-align:right;font-size:12px;color:var(--ink-3);line-height:1.5}
.sello b{display:block;color:var(--ink);font-size:13px}

nav.pest{display:flex;gap:2px;border-bottom:1px solid var(--linea);margin-bottom:18px;
 overflow-x:auto;padding-bottom:0}
nav.pest button{all:unset;cursor:pointer;padding:8px 14px;font-size:14px;color:var(--ink-3);
 border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
nav.pest button:hover{color:var(--ink)}
nav.pest button[aria-selected="true"]{color:var(--azul-alto);font-weight:600;border-bottom-color:var(--azul)}
nav.pest button:focus-visible{outline:2px solid var(--azul);outline-offset:-2px;border-radius:4px}
nav.pest .cuenta{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
 background:var(--superficie-2);border:1px solid var(--linea);border-radius:9px;padding:0 6px}

h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
 margin:26px 0 9px;font-weight:700}
h2:first-child{margin-top:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
 background:var(--linea);border:1px solid var(--linea);border-radius:6px;overflow:hidden}
.tile{background:var(--superficie);padding:12px 15px}
.tile dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700}
.tile dd{margin:4px 0 0;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.tile dd small{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:5px}
.tile.bien dd{color:var(--verde)} .tile.aviso dd{color:var(--ambar)}
.tile.mal dd{color:var(--rojo)} .tile.acento dd{color:var(--azul)}

.caja{background:var(--superficie);border:1px solid var(--linea);border-radius:6px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{background:var(--superficie-2);text-align:left;font-weight:600;font-size:10.5px;
 text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:7px 10px;
 border-bottom:1px solid var(--linea);white-space:nowrap}
thead th.ord{cursor:pointer;user-select:none}
thead th.ord:hover{color:var(--ink)}
thead th.ord::after{content:'';opacity:.35;margin-left:5px}
thead th.ord[data-dir="asc"]::after{content:'▲';opacity:.9}
thead th.ord[data-dir="desc"]::after{content:'▼';opacity:.9}
tbody td{padding:6px 10px;border-bottom:1px solid var(--linea-suave)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--superficie-2)}
tfoot td{padding:8px 10px;border-top:1px solid var(--linea);font-weight:600;background:var(--superficie-2)}
.nombre{font-weight:600} .dim{color:var(--ink-3);font-size:12px}
.vacio{padding:30px 16px;text-align:center;color:var(--ink-3)}

.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;
 white-space:nowrap;border:1px solid transparent}
.pill.pend{background:var(--ambar-suave);color:var(--ambar);border-color:var(--ambar)}
.pill.remesa{background:var(--azul-suave);color:var(--azul-alto);border-color:var(--azul)}
.pill.cobr{background:var(--verde-suave);color:var(--verde);border-color:var(--verde)}
.pill.devu{background:var(--rojo-suave);color:var(--rojo);border-color:var(--rojo)}
.pill.gris{background:var(--superficie-2);color:var(--ink-3);border-color:var(--linea)}

.filtros{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;color:var(--ink);background:var(--superficie);
 border:1px solid var(--linea);border-radius:5px;padding:5px 9px}
input:focus,select:focus{outline:2px solid var(--azul);outline-offset:-1px;border-color:var(--azul)}
input[type="search"]{min-width:230px}
button.btn{all:unset;cursor:pointer;padding:6px 12px;border-radius:5px;font-size:13.5px;font-weight:600;
 border:1px solid var(--linea);background:var(--superficie);color:var(--ink)}
button.btn:hover{border-color:var(--ink-3)}
button.btn:focus-visible{outline:2px solid var(--azul);outline-offset:1px}

.barra{display:flex;height:9px;border-radius:5px;overflow:hidden;border:1px solid var(--linea);margin:14px 0 0}
.barra i{display:block}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:7px}
.leyenda span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.leyenda .l1::before{background:var(--verde)}
.leyenda .l2::before{background:var(--azul)}
.leyenda .l3::before{background:var(--ambar)}
.leyenda .l4::before{background:var(--rojo)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.nota{margin-top:32px;padding-top:14px;border-top:1px solid var(--linea);
 font-size:12px;color:var(--ink-3);max-width:62ch}
.nota b{color:var(--ink-2)}
@media (max-width:760px){ .dos{grid-template-columns:1fr} .sello{margin-left:0;text-align:left} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('datos').textContent);
const FAC = D.facturas, ASO = D.asociados, DEV = D.devoluciones;
const HOY = D.generado;

const fmt = new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur = n => fmt.format(Number(n)||0)+' €';
const r2 = n => Math.round((Number(n)+Number.EPSILON)*100)/100;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fes = iso => iso && iso.length>=10 ? iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4) : '';
const trim = iso => iso && iso.length>=7 ? Math.floor((+iso.slice(5,7)-1)/3)+1 : 0;
const dias = (a,b) => Math.round((new Date(b)-new Date(a))/864e5);
const suma = xs => r2(xs.reduce((s,x)=>s+(+x.total||0),0));
const sinTildes = s => String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

const COBRADAS = FAC.filter(f=>f.estado==='Cobrada');
const EN_REMESA = FAC.filter(f=>f.estado==='En remesa');
const DEVUELTAS = FAC.filter(f=>f.estado==='Devuelta');
const PEND = FAC.filter(f=>f.estado==='Pendiente');
const SIN_COBRAR = FAC.filter(f=>f.estado!=='Cobrada');
const GASTOS_DEV = r2(DEV.reduce((s,d)=>s+(+d.gastos||0),0));

const PILL = {'Cobrada':['cobr','Cobrada'],'Devuelta':['devu','Devuelta'],
              'En remesa':['remesa','En remesa'],'Pendiente':['pend','Pendiente']};
const pill = e => { const [k,t] = PILL[e] || ['pend', e||'Pendiente']; return `<span class="pill ${k}">${esc(t)}</span>`; };

/* por asociado */
const PORASO = (()=>{
  const m = new Map();
  for(const f of FAC){
    const a = ASO.find(x=>x.cif===f.cif) || {};
    let r = m.get(f.cif);
    if(!r){ r = {cif:f.cif, nombre:f.nombre||a.nombre||'', tipo:a.tipo||'Trimestral',
                 cuota:a.cuota||0, nota:a.nota||'', n:0, emitido:0, cobrado:0, sinCobrar:0};
            m.set(f.cif, r); }
    r.n++; r.emitido = r2(r.emitido + f.total);
    if(f.estado==='Cobrada') r.cobrado = r2(r.cobrado + f.total);
    else r.sinCobrar = r2(r.sinCobrar + f.total);
  }
  return [...m.values()];
})();

/* por trimestre */
const PORTRIM = (()=>{
  const m = {};
  for(const f of FAC){
    const k = `${(f.fecha||'').slice(0,4)} · ${trim(f.fecha)}T`;
    const r = m[k] || (m[k] = {n:0, emitido:0, cobrado:0, sinCobrar:0});
    r.n++; r.emitido = r2(r.emitido + f.total);
    if(f.estado==='Cobrada') r.cobrado = r2(r.cobrado + f.total);
    else r.sinCobrar = r2(r.sinCobrar + f.total);
  }
  return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));
})();

const SECCIONES = [
  {id:'resumen', nom:'Resumen'},
  {id:'asociados', nom:'Asociados', n:PORASO.length},
  {id:'facturas', nom:'Facturas', n:FAC.length},
  {id:'devoluciones', nom:'Devoluciones', n:DEV.length}
];
let vista = 'resumen';
const F = { aso:{q:'', tipo:'', deuda:''}, fac:{q:'', estado:'', trim:''} };
const ORD = { aso:{col:'sinCobrar', dir:'desc'}, fac:{col:'num', dir:'desc'} };

function ordenar(arr, col, dir){
  const s = [...arr].sort((a,b)=>{
    const x=a[col], y=b[col];
    if(typeof x==='number' && typeof y==='number') return x-y;
    return String(x??'').localeCompare(String(y??''),'es',{numeric:true});
  });
  return dir==='desc' ? s.reverse() : s;
}
const th = (grupo,col,txt,cls) =>
  `<th class="ord ${cls||''}" data-ord="${grupo}:${col}"${ORD[grupo].col===col?` data-dir="${ORD[grupo].dir}"`:''}>${txt}</th>`;

/* ---------- vistas ---------- */
function vResumen(){
  const tot = suma(FAC) || 1;
  const pc = xs => r2(suma(xs)/tot*100);
  const deudores = PORASO.filter(r=>r.sinCobrar>0).sort((a,b)=>b.sinCobrar-a.sinCobrar);
  const retraso = SIN_COBRAR.map(f=>({...f, d:f.vto?dias(f.vto,HOY):0}))
    .filter(f=>f.d>0).sort((a,b)=>b.d-a.d);
  return `
  <dl class="tiles">
    <div class="tile"><dt>Emitido</dt><dd>${eur(suma(FAC))}<small>${FAC.length} fra.</small></dd></div>
    <div class="tile bien"><dt>Cobrado</dt><dd>${eur(suma(COBRADAS))}<small>${COBRADAS.length}</small></dd></div>
    <div class="tile acento"><dt>En remesa</dt><dd>${eur(suma(EN_REMESA))}<small>${EN_REMESA.length}</small></dd></div>
    <div class="tile aviso"><dt>Pendiente</dt><dd>${eur(suma(PEND))}<small>${PEND.length}</small></dd></div>
    <div class="tile mal"><dt>Devuelto</dt><dd>${eur(suma(DEVUELTAS)+DEV.filter(d=>!d.numFactura).reduce((s,d)=>s+d.importe,0))}<small>+${eur(GASTOS_DEV)} gastos</small></dd></div>
  </dl>
  <div class="barra">
    <i style="width:${pc(COBRADAS)}%;background:var(--verde)"></i>
    <i style="width:${pc(EN_REMESA)}%;background:var(--azul)"></i>
    <i style="width:${pc(PEND)}%;background:var(--ambar)"></i>
    <i style="width:${pc(DEVUELTAS)}%;background:var(--rojo)"></i>
  </div>
  <div class="leyenda">
    <span class="l1">Cobrado ${Math.round(pc(COBRADAS))} %</span>
    <span class="l2">En remesa ${Math.round(pc(EN_REMESA))} %</span>
    <span class="l3">Pendiente ${Math.round(pc(PEND))} %</span>
    <span class="l4">Devuelto ${Math.round(pc(DEVUELTAS))} %</span>
  </div>
  <div class="dos">
    <section>
      <h2>Por trimestre</h2>
      <div class="caja"><table>
        <thead><tr><th>Periodo</th><th class="num">Nº</th><th class="num">Emitido</th><th class="num">Cobrado</th><th class="num">Sin cobrar</th></tr></thead>
        <tbody>${PORTRIM.map(([k,v])=>`<tr><td class="nombre">${esc(k)}</td><td class="num">${v.n}</td>
          <td class="num mono">${eur(v.emitido)}</td>
          <td class="num mono" style="color:var(--verde)">${eur(v.cobrado)}</td>
          <td class="num mono" style="color:${v.sinCobrar?'var(--ambar)':'var(--ink-3)'}">${eur(v.sinCobrar)}</td></tr>`).join('')}</tbody>
      </table></div>
    </section>
    <section>
      <h2>Quién debe más</h2>
      <div class="caja"><table>
        <thead><tr><th>Asociado</th><th class="num">Sin cobrar</th></tr></thead>
        <tbody>${deudores.length ? deudores.slice(0,10).map(r=>`<tr>
          <td><button class="btn" style="all:unset;cursor:pointer;color:var(--azul)" data-ir-aso="${esc(r.nombre)}">${esc(r.nombre)}</button></td>
          <td class="num mono">${eur(r.sinCobrar)}</td></tr>`).join('')
          : `<tr><td colspan="2" class="vacio">Todo cobrado.</td></tr>`}</tbody>
      </table></div>
      ${deudores.length>10?`<p class="dim" style="margin:6px 2px">y ${deudores.length-10} más en la pestaña Asociados.</p>`:''}
    </section>
  </div>
  <h2>Vencidas sin cobrar</h2>
  <div class="caja"><table>
    <thead><tr><th>Nº</th><th>Asociado</th><th>Vencimiento</th><th class="num">Importe</th><th>Estado</th><th class="num">Días</th></tr></thead>
    <tbody>${retraso.length ? retraso.slice(0,15).map(f=>`<tr>
      <td class="mono">${esc(f.num)}</td><td>${esc(f.nombre)}</td>
      <td class="mono dim">${fes(f.vto)}</td><td class="num mono">${eur(f.total)}</td>
      <td>${pill(f.estado)}</td>
      <td class="num" style="color:${f.d>60?'var(--rojo)':'var(--ambar)'}">${f.d}</td></tr>`).join('')
      : `<tr><td colspan="6" class="vacio">Nada vencido.</td></tr>`}</tbody>
  </table></div>
  ${retraso.length>15?`<p class="dim" style="margin:6px 2px">y ${retraso.length-15} más en la pestaña Facturas.</p>`:''}`;
}

function vAsociados(){
  let l = PORASO;
  if(F.aso.tipo) l = l.filter(r=>r.tipo===F.aso.tipo);
  if(F.aso.deuda==='si') l = l.filter(r=>r.sinCobrar>0);
  if(F.aso.deuda==='no') l = l.filter(r=>r.sinCobrar===0);
  if(F.aso.q){ const q=sinTildes(F.aso.q); l = l.filter(r=>sinTildes(r.nombre).includes(q)||sinTildes(r.cif).includes(q)); }
  l = ordenar(l, ORD.aso.col, ORD.aso.dir);
  return `
  <div class="filtros">
    <input type="search" id="q-aso" placeholder="Buscar asociado o CIF" value="${esc(F.aso.q)}" aria-label="Buscar asociado">
    <select id="tipo-aso" aria-label="Tipo de cuota">
      <option value="">Trimestrales y anuales</option>
      <option value="Trimestral"${F.aso.tipo==='Trimestral'?' selected':''}>Solo cuota trimestral</option>
      <option value="Anual"${F.aso.tipo==='Anual'?' selected':''}>Solo cuota anual</option>
    </select>
    <select id="deuda-aso" aria-label="Situación de cobro">
      <option value="">Todos</option>
      <option value="si"${F.aso.deuda==='si'?' selected':''}>Con importe sin cobrar</option>
      <option value="no"${F.aso.deuda==='no'?' selected':''}>Todo cobrado</option>
    </select>
    <span class="dim">${l.length} de ${PORASO.length}</span>
    <button class="btn" data-csv="aso" id="csv-aso">Descargar CSV</button>
  </div>
  <div class="caja"><table>
    <thead><tr>${th('aso','nombre','Asociado')}${th('aso','tipo','Tipo de cuota')}
      ${th('aso','cuota','Cuota','num')}${th('aso','emitido','Emitido','num')}
      ${th('aso','cobrado','Cobrado','num')}${th('aso','sinCobrar','Sin cobrar','num')}</tr></thead>
    <tbody>${l.length ? l.map(r=>`<tr>
      <td><span class="nombre">${esc(r.nombre)}</span>${r.nota?`<div class="dim">${esc(r.nota)}</div>`:''}</td>
      <td><span class="pill gris">${esc(r.tipo)}</span></td>
      <td class="num mono">${r.cuota?eur(r.cuota):'—'}</td>
      <td class="num mono">${eur(r.emitido)}</td>
      <td class="num mono" style="color:${r.cobrado?'var(--verde)':'var(--ink-3)'}">${r.cobrado?eur(r.cobrado):'—'}</td>
      <td class="num mono" style="color:${r.sinCobrar?'var(--ambar)':'var(--ink-3)'}">${r.sinCobrar?eur(r.sinCobrar):'—'}</td></tr>`).join('')
      : `<tr><td colspan="6" class="vacio">Ningún asociado encaja con el filtro.</td></tr>`}</tbody>
    ${l.length?`<tfoot><tr><td colspan="3">Total · ${l.length} asociados</td>
      <td class="num mono">${eur(l.reduce((s,r)=>s+r.emitido,0))}</td>
      <td class="num mono">${eur(l.reduce((s,r)=>s+r.cobrado,0))}</td>
      <td class="num mono">${eur(l.reduce((s,r)=>s+r.sinCobrar,0))}</td></tr></tfoot>`:''}
  </table></div>`;
}

function vFacturas(){
  let l = FAC;
  if(F.fac.estado) l = l.filter(f=>f.estado===F.fac.estado);
  if(F.fac.trim) l = l.filter(f=>`${(f.fecha||'').slice(0,4)}-${trim(f.fecha)}`===F.fac.trim);
  if(F.fac.q){ const q=sinTildes(F.fac.q);
    l = l.filter(f=>[f.num,f.nombre,f.cif].some(v=>sinTildes(v).includes(q))); }
  l = ordenar(l, ORD.fac.col, ORD.fac.dir);
  const periodos = [...new Set(FAC.map(f=>`${(f.fecha||'').slice(0,4)}-${trim(f.fecha)}`))].sort().reverse();
  return `
  <div class="filtros">
    <input type="search" id="q-fac" placeholder="Buscar número, asociado o CIF" value="${esc(F.fac.q)}" aria-label="Buscar factura">
    <select id="estado-fac" aria-label="Estado">
      <option value="">Todos los estados</option>
      ${['Pendiente','En remesa','Cobrada','Devuelta'].map(e=>`<option value="${e}"${F.fac.estado===e?' selected':''}>${e}</option>`).join('')}
    </select>
    <select id="trim-fac" aria-label="Periodo">
      <option value="">Todos los periodos</option>
      ${periodos.map(p=>`<option value="${p}"${F.fac.trim===p?' selected':''}>${p.split('-')[0]} · ${p.split('-')[1]}T</option>`).join('')}
    </select>
    <span class="dim">${l.length} de ${FAC.length}</span>
    <button class="btn" data-csv="fac" id="csv-fac">Descargar CSV</button>
  </div>
  <div class="caja"><table>
    <thead><tr>${th('fac','num','Nº')}${th('fac','fecha','Fecha')}${th('fac','vto','Vto.')}
      ${th('fac','nombre','Asociado')}<th>Concepto</th>${th('fac','total','Importe','num')}
      ${th('fac','estado','Estado')}<th>Cobro</th></tr></thead>
    <tbody>${l.length ? l.map(f=>{
      const d = f.vto && f.estado!=='Cobrada' ? dias(f.vto,HOY) : 0;
      return `<tr>
        <td class="mono nombre">${esc(f.num)}</td>
        <td class="mono dim">${fes(f.fecha)}</td>
        <td class="mono dim">${fes(f.vto)}${d>0?`<div style="color:${d>60?'var(--rojo)':'var(--ambar)'};font-size:11.5px">${d} días</div>`:''}</td>
        <td>${esc(f.nombre)}</td>
        <td class="dim">${esc(f.concepto)}${f.periodo?`<div class="dim">${esc(f.periodo)}</div>`:''}</td>
        <td class="num mono nombre">${eur(f.total)}</td>
        <td>${pill(f.estado)}</td>
        <td class="dim mono">${f.fcobro?fes(f.fcobro):''}${f.banco?`<div class="dim">${esc(f.banco)}</div>`:''}</td></tr>`;}).join('')
      : `<tr><td colspan="8" class="vacio">Ninguna factura encaja con el filtro.</td></tr>`}</tbody>
    ${l.length?`<tfoot><tr><td colspan="5">Total · ${l.length} facturas</td>
      <td class="num mono">${eur(suma(l))}</td><td colspan="2"></td></tr></tfoot>`:''}
  </table></div>`;
}

function vDevoluciones(){
  const l = [...DEV].sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  return `
  <div class="caja"><table>
    <thead><tr><th>Fecha</th><th>Deudor</th><th>Factura</th><th>Banco</th>
      <th class="num">Recibo</th><th class="num">Gastos</th><th class="num">Total</th><th>Estado</th></tr></thead>
    <tbody>${l.length ? l.map(d=>`<tr>
      <td class="mono">${fes(d.fecha)}</td>
      <td class="nombre">${esc(d.nombre||'Sin identificar')}</td>
      <td class="mono dim">${esc(d.numFactura||'—')}</td>
      <td>${esc(d.banco)}</td>
      <td class="num mono">${eur(d.importe)}</td>
      <td class="num mono">${eur(d.gastos)}</td>
      <td class="num mono nombre">${eur(d.importe+d.gastos)}</td>
      <td>${pill(d.estado==='Recuperada'?'Cobrada':'Devuelta')}</td></tr>`).join('')
      : `<tr><td colspan="8" class="vacio">Ningún recibo devuelto.</td></tr>`}</tbody>
    ${l.length?`<tfoot><tr><td colspan="6">Total devuelto con gastos</td>
      <td class="num mono">${eur(l.reduce((s,d)=>s+d.importe+d.gastos,0))}</td><td></td></tr></tfoot>`:''}
  </table></div>`;
}

/* ---------- pintado ---------- */
function pintar(){
  document.getElementById('sello').innerHTML =
    `<b>Datos a ${fes(HOY)}</b>${FAC.length} facturas · ${eur(suma(SIN_COBRAR))} sin cobrar`;
  document.getElementById('pest').innerHTML = SECCIONES.map(s=>
    `<button type="button" role="tab" data-ir="${s.id}" aria-selected="${s.id===vista}">${s.nom}`+
    (s.n!==undefined?`<span class="cuenta">${s.n}</span>`:'')+`</button>`).join('');
  document.getElementById('vista').innerHTML =
    ({resumen:vResumen, asociados:vAsociados, facturas:vFacturas, devoluciones:vDevoluciones})[vista]();
  document.getElementById('nota').innerHTML =
    `<b>De dónde salen estos datos.</b> De la herramienta de facturación que lleva la asesoría, `+
    `con los datos a ${fes(HOY)}. «Cobrado» son los cobros confirmados contra los extractos bancarios. `+
    `«En remesa» son recibos domiciliados enviados al banco cuyo cargo todavía no se ha confirmado contra `+
    `el extracto, así que no cuentan como cobrados. Esta página es solo de consulta y no incluye cuentas `+
    `bancarias ni datos de domiciliación.`;
}

async function csv(cab, filas, nombre){
  const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const txt = '﻿'+[cab,...filas].map(f=>f.map(q).join(';')).join('\r\n');
  if(window.claude && window.claude.use){
    let d = null;
    try{ d = await window.claude.use('downloads'); }catch(e){ d = null; }
    if(d){ try{ await d.save({filename:nombre, data:txt}); }catch(e){} return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-ir],[data-ord],[data-csv],[data-ir-aso]');
  if(!t) return;
  if(t.dataset.ir){ vista = t.dataset.ir; pintar(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.irAso){ vista='asociados'; F.aso.q = t.dataset.irAso; pintar(); return; }
  if(t.dataset.ord){
    const [g,c] = t.dataset.ord.split(':');
    if(ORD[g].col===c) ORD[g].dir = ORD[g].dir==='asc' ? 'desc' : 'asc';
    else { ORD[g].col = c; ORD[g].dir = (c==='nombre'||c==='num'||c==='tipo'||c==='estado') ? 'asc' : 'desc'; }
    pintar(); return;
  }
  if(t.dataset.csv==='aso'){
    csv(['ASOCIADO','CIF','TIPO DE CUOTA','CUOTA','FACTURAS','EMITIDO','COBRADO','SIN COBRAR'],
      ordenar(PORASO,ORD.aso.col,ORD.aso.dir).map(r=>[r.nombre,r.cif,r.tipo,
        fmt.format(r.cuota),r.n,fmt.format(r.emitido),fmt.format(r.cobrado),fmt.format(r.sinCobrar)]),
      'Cobros ANFALUM por asociado.csv');
  }
  if(t.dataset.csv==='fac'){
    csv(['Nº FRA.','F. FRA.','F. VTO.','ASOCIADO','CIF','CONCEPTO','PERIODO','IMPORTE','ESTADO','F. COBRO','BANCO'],
      ordenar(FAC,ORD.fac.col,ORD.fac.dir).map(f=>[f.num,fes(f.fecha),fes(f.vto),f.nombre,f.cif,
        f.concepto,f.periodo,fmt.format(f.total),f.estado,fes(f.fcobro),f.banco]),
      'Cobros ANFALUM facturas.csv');
  }
});

document.addEventListener('input', ev => {
  const id = ev.target.id;
  if(id!=='q-aso' && id!=='q-fac') return;
  const pos = ev.target.selectionStart;
  if(id==='q-aso') F.aso.q = ev.target.value; else F.fac.q = ev.target.value;
  pintar();
  const n = document.getElementById(id);
  if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }
});
document.addEventListener('change', ev => {
  const id = ev.target.id, v = ev.target.value;
  if(id==='tipo-aso') F.aso.tipo = v;
  else if(id==='deuda-aso') F.aso.deuda = v;
  else if(id==='estado-fac') F.fac.estado = v;
  else if(id==='trim-fac') F.fac.trim = v;
  else return;
  pintar();
});

pintar();
})();
</script>
