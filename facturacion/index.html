<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Facturación ANFALUM y ASEFACOL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#131c26; --ink-2:#3d4a58; --ink-3:#6b7887;
  --azul:#27578f; --azul-alto:#1c4271; --azul-suave:#eaf0f7;
  --ambar:#e9a12c; --ambar-suave:#fdf4e2;
  --verde:#1f7a4d; --verde-suave:#e7f3ec;
  --rojo:#b03028; --rojo-suave:#fbecea;
  --papel:#f4f6f8; --superficie:#ffffff; --superficie-2:#fafbfc;
  --linea:#d3dae2; --linea-suave:#e6eaef;
  --sombra:0 1px 2px rgba(19,28,38,.06);
  --editable:#fffbe8;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#e9edf2; --ink-2:#b3bdc8; --ink-3:#8290a0;
  --azul:#77a8dd; --azul-alto:#a2c5e9; --azul-suave:#1a2836;
  --ambar:#e2a949; --ambar-suave:#2e2413;
  --verde:#5fc08c; --verde-suave:#14291e;
  --rojo:#e58076; --rojo-suave:#2e1917;
  --papel:#0f151c; --superficie:#171f28; --superficie-2:#1b242e;
  --linea:#2f3c49; --linea-suave:#242f3a;
  --sombra:0 1px 2px rgba(0,0,0,.4);
  --editable:#2a2517;
}}
:root[data-theme="dark"]{
  --ink:#e9edf2; --ink-2:#b3bdc8; --ink-3:#8290a0;
  --azul:#77a8dd; --azul-alto:#a2c5e9; --azul-suave:#1a2836;
  --ambar:#e2a949; --ambar-suave:#2e2413;
  --verde:#5fc08c; --verde-suave:#14291e;
  --rojo:#e58076; --rojo-suave:#2e1917;
  --papel:#0f151c; --superficie:#171f28; --superficie-2:#1b242e;
  --linea:#2f3c49; --linea-suave:#242f3a;
  --sombra:0 1px 2px rgba(0,0,0,.4);
  --editable:#2a2517;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--ink);
  font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* ---------- estructura ---------- */
#app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
#rail{background:var(--superficie);border-right:1px solid var(--linea);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.marca{padding:18px 16px 14px;border-bottom:1px solid var(--linea-suave)}
.marca .logo{display:flex;align-items:center;gap:9px}
.marca .wordmark{font-weight:700;font-size:17px;letter-spacing:-.2px;color:var(--azul)}
.marca .sub{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-top:5px}
.sel-ent{display:block;margin-top:11px}
.sel-ent .eti{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);margin-bottom:3px}
.sel-ent select{font-size:13px;font-weight:600;padding:4px 7px}
nav{padding:8px;display:flex;flex-direction:column;gap:1px;flex:1}
nav button{all:unset;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border-radius:5px;cursor:pointer;color:var(--ink-2);font-size:14px}
nav button:hover{background:var(--superficie-2);color:var(--ink)}
nav button[aria-current="true"]{background:var(--azul-suave);color:var(--azul-alto);font-weight:600}
nav button:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
nav .cuenta{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
nav button[aria-current="true"] .cuenta{color:var(--azul)}
#rail footer{padding:10px 16px 16px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--linea-suave)}
main{min-width:0;padding-block:0;padding:0 24px 56px}
.cabecera{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--papel);
  padding-block:18px 12px;border-bottom:1px solid var(--linea);margin-bottom:16px}
.cabecera .fila{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:-.25px;font-weight:700;text-wrap:balance}
.lede{color:var(--ink-3);font-size:13px;margin:2px 0 0}
.acciones{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- controles ---------- */
button.btn{all:unset;cursor:pointer;padding:6px 13px;border-radius:5px;font-size:13.5px;font-weight:600;
  border:1px solid var(--linea);background:var(--superficie);color:var(--ink);white-space:nowrap}
button.btn:hover{border-color:var(--ink-3)}
button.btn:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
button.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}
button.btn.pri:hover{background:var(--azul-alto);border-color:var(--azul-alto)}
button.btn.peligro{color:var(--rojo);border-color:var(--linea)}
button.btn[disabled]{opacity:.45;cursor:not-allowed}
button.mini{all:unset;cursor:pointer;font-size:12.5px;color:var(--azul);padding:2px 5px;border-radius:4px}
button.mini:hover{background:var(--azul-suave)}
button.mini:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--superficie);
  border:1px solid var(--linea);border-radius:5px;padding:5px 8px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--azul);outline-offset:-1px;border-color:var(--azul)}
input.edit{background:var(--editable)}
label.campo{display:block;font-size:12px;color:var(--ink-3);margin-bottom:12px;letter-spacing:.02em}
label.campo>span{display:block;margin-bottom:3px;font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em}
.rejilla{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.ayuda{font-size:11.5px;color:var(--ink-3);margin-top:-8px;margin-bottom:12px}
.lista-sel+.ayuda,.tabla-caja+.ayuda{margin-top:8px}
.ayuda.mal{color:var(--rojo)}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--linea);border:1px solid var(--linea);border-radius:6px;overflow:hidden;margin-bottom:16px}
.tile{background:var(--superficie);padding:11px 14px}
.tile dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.tile dd{margin:3px 0 0;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.tile dd small{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:5px}
.tile.acento dd{color:var(--azul)}
.tile.aviso dd{color:var(--ambar)}
.tile.bien dd{color:var(--verde)}
.tile.mal dd{color:var(--rojo)}

/* ---------- tablas ---------- */
.tabla-caja{background:var(--superficie);border:1px solid var(--linea);border-radius:6px;overflow-x:auto;box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{background:var(--superficie-2);text-align:left;font-weight:600;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:7px 10px;
  border-bottom:1px solid var(--linea);white-space:nowrap;position:sticky;top:0;z-index:1}
tbody td{padding:6px 10px;border-bottom:1px solid var(--linea-suave);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--superficie-2)}
tfoot td{padding:8px 10px;border-top:1px solid var(--linea);font-weight:600;background:var(--superficie-2)}
td.acc{text-align:right;white-space:nowrap}
.nombre{font-weight:600}
.dim{color:var(--ink-3);font-size:12px}
.vacio{padding:34px 16px;text-align:center;color:var(--ink-3);font-size:13.5px}

.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;
  letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.pill.pend{background:var(--ambar-suave);color:var(--ambar);border-color:var(--ambar)}
.pill.remesa{background:var(--azul-suave);color:var(--azul-alto);border-color:var(--azul)}
.pill.cobr{background:var(--verde-suave);color:var(--verde);border-color:var(--verde)}
.pill.devu{background:var(--rojo-suave);color:var(--rojo);border-color:var(--rojo)}
.pill.gris{background:var(--superficie-2);color:var(--ink-3);border-color:var(--linea)}
.pill.baja{background:var(--superficie-2);color:var(--ink-3);border-color:var(--linea)}

.filtros{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filtros input[type="search"]{max-width:250px}
.filtros select{width:auto;min-width:130px}

/* ---------- panel lateral ---------- */
.velo{position:fixed;inset:0;background:rgba(19,28,38,.42);z-index:60;display:flex;justify-content:flex-end}
.panel{background:var(--superficie);width:min(560px,100%);height:100%;overflow-y:auto;
  box-shadow:-6px 0 24px rgba(0,0,0,.18);display:flex;flex-direction:column}
.panel header{position:sticky;top:0;background:var(--superficie);border-bottom:1px solid var(--linea);
  padding:14px 20px;display:flex;align-items:center;gap:12px;z-index:2}
.panel header h2{margin:0;font-size:16px;font-weight:700}
.panel header .cerrar{margin-left:auto}
.panel .cuerpo{padding:18px 20px;flex:1}
.panel footer{position:sticky;bottom:0;background:var(--superficie);border-top:1px solid var(--linea);
  padding:12px 20px;display:flex;gap:8px;justify-content:flex-end;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.panel.ancho{width:min(920px,100%)}
fieldset{border:0;padding:0;margin:0 0 6px}
legend{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
  font-weight:700;padding:0;margin-bottom:8px;width:100%;border-bottom:1px solid var(--linea-suave);padding-bottom:5px}

/* ---------- factura impresa ---------- */
.hoja{background:#fff;color:#1a1a1a;padding:34px 38px;border:1px solid var(--linea);border-radius:4px;
  font-size:12px;line-height:1.5;max-width:660px;margin:0 auto}
.hoja{position:relative}
.hoja .logo-hoja{position:absolute;top:30px;right:38px;width:150px;height:auto}
.hoja h3{font-size:22px;margin:0 0 14px;font-weight:700;color:#1a1a1a}
.hoja .meta{display:grid;grid-template-columns:auto auto;gap:2px 18px;justify-content:start;margin-bottom:26px;font-size:11.5px}
.hoja .meta b{font-weight:400;color:#666}
.hoja .partes{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:26px}
.hoja .partes h4{margin:0 0 4px;font-size:11px;color:#666;font-weight:600}
.hoja table{font-size:11.5px;width:100%}
.hoja thead th{background:transparent;border-bottom:1px solid #999;color:#666;position:static;padding:5px 4px}
.hoja tbody td{border-bottom:1px solid #eee;padding:8px 4px;color:#1a1a1a}
.hoja .totales{margin-top:14px;margin-left:auto;width:min(300px,100%)}
.hoja .totales div{display:flex;justify-content:space-between;padding:5px 4px;border-bottom:1px solid #eee}
.hoja .totales div:last-child{font-weight:600;border-bottom:1px solid #999}
.hoja .pie{margin-top:32px;padding-top:8px;border-top:1px solid #ddd;display:flex;justify-content:space-between;font-size:10.5px;color:#666}

.aviso-caja{border:1px solid var(--ambar);background:var(--ambar-suave);color:var(--ink);
  border-radius:6px;padding:10px 13px;font-size:13px;margin-bottom:14px}
.aviso-caja b{color:var(--ambar)}
.aviso-caja.err{border-color:var(--rojo);background:var(--rojo-suave)}
.aviso-caja.err b{color:var(--rojo)}
#brindis{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--papel);padding:9px 17px;border-radius:7px;z-index:90;font-size:13.5px;
  box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:92vw}
.check{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:6px}
.check input{width:auto;margin:0}
.lista-sel{border:1px solid var(--linea);border-radius:6px;max-height:280px;overflow-y:auto;padding:8px 11px;background:var(--superficie-2)}
.totales-fac{margin:12px 0 2px auto;width:min(340px,100%);font-size:13px}
.totales-fac div{display:flex;justify-content:space-between;gap:14px;padding:5px 2px;border-bottom:1px solid var(--linea-suave)}
.totales-fac div:last-child{font-weight:700;border-bottom:0;border-top:1px solid var(--linea);margin-top:2px;padding-top:7px}
.t-lineas td{vertical-align:middle}
.t-lineas td:first-child{width:52%}
.t-lineas th:last-child,.t-lineas td:last-child{width:1%}
.t-lineas input,.t-lineas select{padding:4px 6px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #rail{position:static;height:auto;flex-direction:column;border-right:0;border-bottom:1px solid var(--linea)}
  .marca{padding-bottom:10px}
  nav{flex-direction:row;overflow-x:auto;padding:6px 8px}
  nav button{white-space:nowrap}
  nav .cuenta{display:none}
  #rail footer{display:none}
  main{padding:0 16px 48px}
  .dos{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
[hidden]{display:none!important}
#acceso{position:fixed;inset:0;z-index:200;background:var(--papel);display:flex;
  align-items:center;justify-content:center;padding:24px}
.caja-acceso{background:var(--superficie);border:1px solid var(--linea);border-radius:10px;
  padding:26px 26px 22px;width:min(380px,100%);box-shadow:0 8px 30px rgba(19,28,38,.12)}
.caja-acceso h1{font-size:19px;margin:0 0 2px}
.caja-acceso>p.dim{margin:0 0 18px;font-size:12.5px}
.caja-acceso .campo{margin-bottom:14px}
.caja-acceso button[type="submit"]{box-sizing:border-box;padding:9px 13px}
#pie-rail{line-height:1.4}
</style>
</head>
<body>
<div id="app" hidden>
  <aside id="rail">
    <div class="marca">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M6 42V22a18 18 0 0 1 36 0v20h-7V22a11 11 0 0 0-22 0v20z" fill="#e9a12c"/>
          <path d="M24 32a7 7 0 0 1 7 7v3H17v-3a7 7 0 0 1 7-7z" fill="#27578f"/>
        </svg>
        <span class="wordmark" id="wordmark">anfalum</span>
      </div>
      <div class="sub">Facturación y cobros</div>
      <label class="sel-ent"><span class="eti">Asociación</span>
        <select id="sel-ent" aria-label="Asociación en la que estás trabajando"></select></label>
    </div>
    <nav id="nav"></nav>
    <footer id="pie-rail">Cargando…</footer>
  </aside>
  <main>
    <div class="cabecera">
      <div class="fila">
        <div>
          <h1 id="titulo">Resumen</h1>
          <p class="lede" id="lede"></p>
        </div>
        <div class="acciones" id="acciones"></div>
      </div>
    </div>
    <div id="vista"></div>
  </main>
</div>
<div id="capa"></div>
<div id="acceso" hidden></div>
<script>

(function(){
"use strict";

/* ─── Dónde está la base de datos ───────────────────────────────────────────
   Se rellenan al publicar. Mientras estén vacías, la página las pide al entrar
   y las guarda en el navegador. Vale la clave publicable (sb_publishable_...) o
   la antigua anon (eyJ...): las dos están pensadas para ir en el cliente. Lo que
   protege los datos es el acceso con contraseña y los permisos de la tabla. */
const SUPABASE_URL = 'https://qggfrwqkapttdftllsfz.supabase.co';
const SUPABASE_CLAVE = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnZ2Zyd3FrYXB0dGRmdGxsc2Z6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MzI0OTgsImV4cCI6MjExMTEwODQ5OH0.YHgF_0Dka-_cGERjlVM1Oe9yBz2K1p4YIZdtU773K_M';

const CFG = (() => {
  const q = new URLSearchParams(location.search);
  const leer = k => { try{ return localStorage.getItem('sb_'+k) || ''; }catch(e){ return ''; } };
  const guardar = (k,v) => { try{ localStorage.setItem('sb_'+k, v); }catch(e){} };
  let url = SUPABASE_URL, key = SUPABASE_CLAVE;
  if(q.get('url')){ url = q.get('url').replace(/\/+$/,''); guardar('url', url); }
  if(q.get('key')){ key = q.get('key'); guardar('key', key); }

const mailOk = m => /^[^\s@,;]+@[^\s@,;]+\.[A-Za-z]{2,}$/.test(String(m||'').trim());
function ibanLimpio(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function ibanValido(s){
  s = ibanLimpio(s);
  if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s)) return false;
  if(/^0+$/.test(s.slice(4))) return false;
  const rot = s.slice(4)+s.slice(0,4);
  let resto = 0;
  for(const ch of rot){
    const v = /[A-Z]/.test(ch) ? String(ch.charCodeAt(0)-55) : ch;
    for(const d of v) resto = (resto*10 + (+d)) % 97;
  }
  return resto === 1;
}
function ibanBonito(s){ return ibanLimpio(s).replace(/(.{4})/g,'$1 ').trim(); }

/* Identificador del acreedor SEPA español: ES + control + sufijo + NIF */
function idAcreedor(nif, sufijo){
  nif = String(nif||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  sufijo = String(sufijo||'000').padStart(3,'0').slice(0,3);
  const conv = nif.split('').map(c => /[A-Z]/.test(c) ? String(c.charCodeAt(0)-55) : c).join('');
  let resto = 0;
  for(const d of (conv+'142800')) resto = (resto*10 + (+d)) % 97;
  return 'ES' + String(98-resto).padStart(2,'0') + sufijo + nif;
}
/* Juego de caracteres SEPA */
function sepaTxt(s, max){
  let t = String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[ÑñÇç]/g, c => ({'Ñ':'N','ñ':'n','Ç':'C','ç':'c'}[c]))
    .replace(/[^A-Za-z0-9\/\-?:().,'+ ]/g,' ').replace(/\s+/g,' ').trim();
  return max ? t.slice(0,max) : t;
}
const xesc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));

/* ---------- ZIP (almacenado, sin compresión) ---------- */
const TABLA_CRC = (()=>{ const t=new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[i]=c>>>0; }
  return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c = TABLA_CRC[(c^b[i])&0xFF] ^ (c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(archivos){
  const cod = new TextEncoder(); const trozos=[]; const central=[]; let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const f of archivos){
    const nom = cod.encode(f.nombre);
    const dat = typeof f.datos === 'string' ? cod.encode(f.datos) : f.datos;
    const crc = crc32(dat);
    const cab = new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(dat.length),...u32(dat.length),...u16(nom.length),...u16(0)]);
    trozos.push(cab,nom,dat);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(dat.length),...u32(dat.length),...u16(nom.length),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(0),...u32(off)]), nom);
    off += cab.length + nom.length + dat.length;
  }
  const tamCen = central.reduce((a,c)=>a+c.length,0);
  const fin = new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(archivos.length),...u16(archivos.length),
    ...u32(tamCen),...u32(off),...u16(0)]);
  return new Blob([...trozos,...central,fin],{type:'application/zip'});
}

/* La base de datos vive en Supabase: una sola tabla `docs` con (coleccion, doc_id, datos).
   El adaptador imita la forma que tenía la base del artefacto, así que el resto de la
   aplicación —facturas, remesas, PDF, SEPA— no se entera del cambio. */
const TABLA = 'docs';
let sb = null, sesion = null;

function crearDb(cli){
  const oyentes = {}, canales = {};
  function escuchar(col, fn){
    (oyentes[col] = oyentes[col] || []).push(fn);
    if(canales[col]) return;
    canales[col] = cli.channel('canal-'+col)
      .on('postgres_changes', {event:'*', schema:'public', table:TABLA, filter:'coleccion=eq.'+col},
          () => (oyentes[col]||[]).forEach(f=>f()))
      .subscribe();
  }
  const fallo = e => ({code:(e && (e.code || e.message)) || 'error'});
  return {
    doc(ruta){
      const trozos = String(ruta).split('/');
      const col = trozos.shift(), id = trozos.join('/');
      return {
        async set(datos){
          const d = {...datos}; delete d.id;
          const {error} = await cli.from(TABLA).upsert(
            {coleccion:col, doc_id:id, datos:d, actualizado:new Date().toISOString()},
            {onConflict:'coleccion,doc_id'});
          if(error) throw Object.assign(new Error(error.message), {code:error.code});
        },
        async delete(){
          const {error} = await cli.from(TABLA).delete().eq('coleccion',col).eq('doc_id',id);
          if(error) throw Object.assign(new Error(error.message), {code:error.code});
        },
        onSnapshot(cb, err){
          const tirar = async () => {
            const {data, error} = await cli.from(TABLA).select('datos')
              .eq('coleccion',col).eq('doc_id',id).maybeSingle();
            if(error) return err && err(fallo(error));
            cb({exists: !!data, data: () => (data ? data.datos : {})});
          };
          tirar(); escuchar(col, tirar);
        }
      };
    },
    collection(col){
      return { onSnapshot(cb, err){
        const tirar = async () => {
          const {data, error} = await cli.from(TABLA).select('doc_id,datos')
            .eq('coleccion',col).order('doc_id');
          if(error) return err && err(fallo(error));
          cb({docs:(data||[]).map(r=>({id:r.doc_id, data:()=>r.datos||{}}))});
        };
        tirar(); escuchar(col, tirar);
      }};
    }
  };
}

async function guardar(ruta, datos){
  if(!db){ brindis('No hay base de datos: el cambio no se ha guardado.'); return false; }
  const col = String(ruta).split('/')[0];
  if(COLS.includes(col) && datos && !datos.ent) datos = {...datos, ent:ENT};
  try{ await db.doc(ruta).set(datos); return true; }
  catch(e){
    if(e && e.code === 'invalid_argument'){ puedeEscribir = false; brindis('No tienes permiso para modificar estos datos.'); }
    else brindis('No se ha podido guardar ('+(e&&e.code||'error')+').');
    pintar(); return false;
  }
}
async function borrar(ruta){
  if(!db) return false;
  try{ await db.doc(ruta).delete(); return true; }catch(e){ brindis('No se ha podido eliminar.'); return false; }
}

/* --- líneas de factura (las facturas antiguas, de una sola línea, siguen valiendo) --- */
function normLinea(l){
  const uds = +l.uds||1, precio = +l.precio||0, tipo = +l.tipoIva||0;
  const base = r2(precio*uds), iva = r2(base*tipo/100);
  return {concepto:String(l.concepto||'').trim(), uds, precio, tipoIva:tipo, base, iva, total:r2(base+iva)};
}
function lineasDe(f){
  if(Array.isArray(f.lineas) && f.lineas.length) return f.lineas.map(normLinea);
  const uds = +f.uds||1;
  return [normLinea({concepto:f.concepto, uds, precio:(f.precio!=null&&f.precio!=='')?f.precio:r2((+f.base||0)/uds), tipoIva:f.tipoIva})];
}
function totalesDe(lineas){
  const base = r2(lineas.reduce((s,l)=>s+l.base,0));
  const iva  = r2(lineas.reduce((s,l)=>s+l.iva,0));
  const porTipo = [];
  for(const l of lineas){
    if(!l.tipoIva) continue;
    let g = porTipo.find(x=>x.tipo===l.tipoIva);
    if(!g){ g = {tipo:l.tipoIva, base:0, iva:0}; porTipo.push(g); }
    g.base = r2(g.base+l.base); g.iva = r2(g.iva+l.iva);
  }
  porTipo.sort((a,b)=>a.tipo-b.tipo);
  return {base, iva, total:r2(base+iva), porTipo};
}
function conceptoResumen(f){
  const L = lineasDe(f);
  if(L.length<2) return L[0].concepto||'';
  return `${L[0].concepto} (+${L.length-1} línea${L.length>2?'s':''})`;
}
const clienteDe = f => S.clientes.find(c=>c.cif===f.cif) || null;
function emailDe(f){
  const a = asoDe(f); if(a && a.email) return a.email;
  if(f.email) return f.email;
  const c = clienteDe(f); return (c && c.email) || '';
}

function vResumen(){
  const fs = S.facturas.filter(f=>f.estado!=='Anulada');
  const suma = a => r2(a.reduce((s,f)=>s+(+f.total||0),0));
  const cobradas = fs.filter(f=>f.estado==='Cobrada');
  const enRemesa = fs.filter(f=>f.estado==='En remesa');
  const devueltas = fs.filter(f=>f.estado==='Devuelta');
  const pend = fs.filter(f=>!f.estado || f.estado==='Pendiente');
  const gastosDev = r2(S.devoluciones.reduce((s,d)=>s+(+d.gastos||0),0));

  const porTrim = {};
  for(const f of fs){
    const k = `${(f.fecha||'').slice(0,4)} · ${trimestreDe(f.fecha)}T`;
    porTrim[k] = porTrim[k] || {n:0,total:0,cobrado:0,pendiente:0};

  ${sinDatos.length ? `<div class="aviso-caja"><b>Faltan cuentas.</b> ${sinDatos.length} asociado${sinDatos.length>1?'s':''} marcado${sinDatos.length>1?'s':''} como domiciliado no tiene${sinDatos.length>1?'n':''} un IBAN válido, así que no entrará${sinDatos.length>1?'n':''} en la remesa: ${sinDatos.map(a=>esc(a.nombre)).join(' · ')}.</div>`:''}

  <div class="dos">
    <section>
      <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:6px 0 8px">Por trimestre</h2>
      <div class="tabla-caja"><table>
        <thead><tr><th>Periodo</th><th class="num">Nº</th><th class="num">Emitido</th><th class="num">Cobrado</th><th class="num">Pendiente</th></tr></thead>
        <tbody>${Object.keys(porTrim).length ? Object.entries(porTrim).sort().reverse().map(([k,v])=>`
          <tr><td class="nombre">${esc(k)}</td><td class="num">${v.n}</td><td class="num mono">${eur(v.total)}</td>
          <td class="num mono" style="color:var(--verde)">${eur(v.cobrado)}</td>

          : `<tr><td colspan="5" class="vacio">Todavía no hay facturas emitidas.</td></tr>`}</tbody>
      </table></div>

      <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:6px 0 8px">Vencidas sin cobrar</h2>
      <div class="tabla-caja"><table>

function revisarDevolucion(){
  const msg = document.getElementById('dev-msg'); if(!msg) return;
  const iban = ibanLimpio((document.getElementById('iban-dev')||{}).value);
  const imp = parseFloat((document.getElementById('importe-dev')||{}).value) || 0;
  const sel = document.getElementById('fra-dev');
  const deudor = document.getElementById('deudor-dev');
  const partes = [];
  let a = null;
  if(iban){
    if(!ibanValido(iban)) partes.push('<b style="color:var(--rojo)">Ese IBAN no es válido</b>: revisa el dígito de control.');
    else {
      a = S.asociados.find(x=>ibanLimpio(x.iban)===iban);
      if(a){
        partes.push(`El IBAN es de <b>${esc(a.nombre)}</b> (${esc(a.cif)}).`);
        if(deudor && !deudor.value) deudor.value = a.nombre;
      } else partes.push('IBAN válido, pero <b>no es de ningún asociado</b> de la ficha. Puede venir de otro recibo que no lleva este control.');
    }
  }
  const dom = S.facturas.filter(f=>f.estado!=='Anulada');
  let cand = a ? dom.filter(f=>f.cif===a.cif) : dom;
  if(imp>0){
    const exactas = cand.filter(f=>Math.abs((+f.total||0)-imp)<0.01);
    if(exactas.length) partes.push('Cuadra con '+exactas.map(f=>`<b>${esc(f.num)}</b> · ${esc(f.nombre)} · ${eur(f.total)}`).join(' · ')+'.');
    else if(a) partes.push(`Ninguna factura de ${esc(a.nombre)} suma ${eur(imp)}: sus facturas son `+
      (cand.length?cand.map(f=>`${esc(f.num)} (${eur(f.total)})`).join(' · '):'ninguna')+'.');
    else partes.push(`<b>Ningún importe emitido cuadra con ${eur(imp)}</b>. Si el banco tampoco da el IBAN, pide el detalle del recibo.`);
    if(exactas.length===1 && sel && !sel.value) sel.value = exactas[0].num;
  }
  msg.innerHTML = partes.length ? partes.join(' ')
    : 'Pega aquí el IBAN que da el banco en el detalle de la devolución y te digo de quién es y qué factura suya cuadra.';
  msg.className = 'ayuda';
}
function revisarIban(){
  const inp = document.getElementById('iban-aso'), msg = document.getElementById('iban-msg');
  if(!inp||!msg) return;
  const v = ibanLimpio(inp.value);
  if(!v){ msg.textContent='Sin IBAN no se puede domiciliar: la factura habrá que cobrarla por transferencia.'; msg.className='ayuda'; return; }
  if(ibanValido(v)){ msg.textContent='IBAN válido · '+ibanBonito(v); msg.className='ayuda'; }
  else { msg.textContent='El dígito de control no cuadra. Revisa el IBAN antes de meterlo en una remesa.'; msg.className='ayuda mal'; }
}

/* ---------- emitir cuotas ---------- */
function cuotaDe(a, modo){ return modo==='Anual' ? (+a.cuotaAnual||0) : (+a.cuota||0); }
function candidatosCuota(modo, trim){
  return S.asociados.filter(a=>{
    if(a.activo===false) return false;
    if(modo==='Anual') return (a.periodicidad==='Anual') && (+a.cuotaAnual||0)>0;
    if(a.periodicidad==='Anual') return false;
    if(!((+a.cuota||0)>0)) return false;
    return (a.trimestres||[1,2,3,4]).includes(+trim);
  }).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
}
function panelCuotas(modo, trimSel){
  const hoyIso = hoy();
  modo = modo || 'Trimestral';
  const trim = trimSel || Math.floor((new Date().getMonth())/3)+1;
  const candidatos = candidatosCuota(modo, trim);
  const suma = r2(candidatos.reduce((s,a)=>s+cuotaDe(a,modo),0));
  const anuales = S.asociados.filter(a=>a.activo!==false && a.periodicidad==='Anual');
  const fueraTrim = S.asociados.filter(a=>a.activo!==false && a.periodicidad!=='Anual'
    && (+a.cuota||0)>0 && !(a.trimestres||[1,2,3,4]).includes(+trim));
  const sinCuota = S.asociados.filter(a=>a.activo!==false && a.periodicidad!=='Anual' && !(+a.cuota>0));
  abrirPanel(modo==='Anual'?'Emitir cuotas anuales':'Emitir cuotas del trimestre', `
   <form id="form-cuotas" data-modo="${modo}">
    <div class="rejilla">
      <label class="campo"><span>Cuota a emitir</span><select name="modo" id="modo-cuotas">
        <option value="Trimestral"${modo!=='Anual'?' selected':''}>Trimestral</option>
        <option value="Anual"${modo==='Anual'?' selected':''}>Anual</option>
      </select></label>
      <label class="campo"><span>Fecha de factura</span><input name="fecha" type="date" value="${hoyIso}" required></label>
      <label class="campo"><span>Vencimiento</span><input name="vto" type="date" value="${hoyIso}" required></label>
      <label class="campo"><span>${modo==='Anual'?'Ejercicio':'Trimestre'}</span><select name="trim" id="trim-cuotas"${modo==='Anual'?' disabled':''}>
        ${[1,2,3,4].map(t=>`<option value="${t}"${t===+trim?' selected':''}>${t}T ${new Date().getFullYear()}</option>`).join('')}
      </select></label>
    </div>
    <label class="campo"><span>Concepto</span><input name="concepto" value="${esc(modo==='Anual'?(S.config.conceptoCuotaAnual||'cuota anual asociación'):S.config.conceptoCuota)}" required></label>
    <label class="campo"><span>Régimen de IVA</span><input name="regimen" value="${esc(S.config.regimenCuota)}"></label>
    <fieldset><legend>Asociados a facturar · ${candidatos.length}</legend>
      ${candidatos.length?`<div class="lista-sel">
        ${candidatos.map(a=>`<label class="check"><input type="checkbox" name="sel" value="${esc(a.id)}" checked>
          <span style="flex:1">${esc(a.nombre)}${a.notaCuota?` <span class="dim">· ${esc(a.notaCuota)}</span>`:''}</span>
          <span class="mono num" style="min-width:86px">${eur(cuotaDe(a,modo))}</span>
          <span class="pill ${a.forma==='Recibo domiciliado'?'remesa':'gris'}">${a.forma==='Recibo domiciliado'?'Recibo':'Transf.'}</span></label>`).join('')}
      </div>
      <p class="ayuda">Se emitirán ${candidatos.length} facturas desde la <b class="mono">${esc(numFactura(siguienteNumero()))}</b>, por <b>${eur(suma)}</b>.</p>`
      :`<p class="vacio" style="padding:18px">No hay asociados con cuota ${modo==='Anual'?'anual':'de este trimestre'} en su ficha.</p>`}
    </fieldset>
    ${modo!=='Anual' && (fueraTrim.length||anuales.length||sinCuota.length) ? `<fieldset><legend>Quedan fuera</legend>
      <div class="tabla-caja"><table><thead><tr><th>Asociado</th><th class="num">Cuota</th><th>Motivo</th></tr></thead><tbody>
        ${fueraTrim.map(a=>`<tr><td>${esc(a.nombre)}</td><td class="num mono">${eur(a.cuota)}</td>
          <td class="dim">Solo paga ${(a.trimestres||[]).map(t=>t+'T').join(' y ')}${a.notaCuota?' · '+esc(a.notaCuota):''}</td></tr>`).join('')}
        ${anuales.map(a=>`<tr><td>${esc(a.nombre)}</td><td class="num mono">${a.cuotaAnual?eur(a.cuotaAnual):'—'}</td>
          <td class="dim">Cuota anual, no trimestral</td></tr>`).join('')}
        ${sinCuota.map(a=>`<tr><td>${esc(a.nombre)}</td><td class="num mono">—</td>
          <td class="dim">Sin cuota fijada en su ficha</td></tr>`).join('')}
      </tbody></table></div>
    </fieldset>`:''}
   </form>`,
   `<button class="btn" data-cerrar>Cancelar</button><button class="btn pri" data-emitir-cuotas>Emitir facturas</button>`, true);
}

/* ---------- factura suelta: cliente editable y varias líneas ---------- */
const TIPOS_IVA = [0,4,10,21];
let lineasFac = [];
const lineaVacia = () => ({concepto:'', uds:'1', precio:'', tipoIva:'0'});

function filaLineaHTML(l, i, total){
  return `<tr>
    <td><input data-linea="concepto" data-i="${i}" value="${esc(l.concepto)}" placeholder="Inscripción jornada técnica" required></td>
    <td><input data-linea="uds" data-i="${i}" type="number" step="0.01" min="0" value="${esc(l.uds)}" class="mono num" style="min-width:66px"></td>
    <td><input data-linea="precio" data-i="${i}" type="number" step="0.01" value="${esc(l.precio)}" class="mono num edit" style="min-width:96px" required></td>
    <td><select data-linea="tipoIva" data-i="${i}" style="min-width:94px">${TIPOS_IVA.map(x=>`<option value="${x}"${(+l.tipoIva||0)===x?' selected':''}>${x?x+' %':'Exenta'}</option>`).join('')}</select></td>
    <td class="num mono" data-imp="${i}">—</td>
    <td class="acc">${total>1?`<button type="button" class="mini" data-del-linea="${i}" aria-label="Quitar línea ${i+1}">Quitar</button>`:''}</td>
  </tr>`;
}
function leerLineas(){
  const caja = document.getElementById('lineas-fac');
  if(caja) caja.querySelectorAll('[data-linea]').forEach(el=>{
    const i = +el.dataset.i;
    if(lineasFac[i]) lineasFac[i][el.dataset.linea] = el.value;
  });
  return lineasFac;
}
function actualizarTotales(){
  const L = leerLineas().map(normLinea), T = totalesDe(L);
  L.forEach((l,i)=>{ const c = document.querySelector(`[data-imp="${i}"]`); if(c) c.textContent = l.base?num2(l.base):'—'; });
  const el = document.getElementById('totales-fac');
  if(el) el.innerHTML = `
    <div><span>Base imponible</span><span class="mono">${eur(T.base)}</span></div>
    ${T.porTipo.map(g=>`<div><span>IVA ${g.tipo} % sobre ${eur(g.base)}</span><span class="mono">${eur(g.iva)}</span></div>`).join('')}
    <div><span>Total factura</span><span class="mono">${eur(T.total)}</span></div>`;
}
function pintarLineas(){
  const caja = document.getElementById('lineas-fac');
  if(!caja) return;
  caja.innerHTML = lineasFac.map((l,i)=>filaLineaHTML(l,i,lineasFac.length)).join('');
  actualizarTotales();
}
function panelFactura(id){
  const f = id ? S.facturas.find(x=>x.id===id) : null;
  if(id && !f) return;
  lineasFac = f
    ? lineasDe(f).map(l=>({concepto:l.concepto, uds:String(l.uds), precio:String(l.precio), tipoIva:String(l.tipoIva)}))
    : [lineaVacia()];
  const porNombre = (a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es');
  const asos = [...S.asociados].sort(porNombre), clis = [...S.clientes].sort(porNombre);
  const v = c => esc(f ? (f[c] || '') : '');
  const enFirme = !!f && ['En remesa','Cobrada','Devuelta'].includes(f.estado);
  abrirPanel(f ? `Editar factura ${f.num}` : 'Nueva factura', `
   <form id="form-fac-suelta" data-id="${f?esc(f.id):''}">
    ${f ? `<div class="aviso-caja${enFirme?' err':''}">${enFirme
        ? `<b>Cuidado:</b> esta factura está <b>${esc(estadoFactura(f).t.toLowerCase())}</b>. Lo que cambies aquí no toca la remesa ya generada ni el cobro apuntado, y una factura que ya está en manos del cliente se corrige con una rectificativa, no reescribiéndola.`
        : `Mantiene su número <b class="mono">${esc(f.num)}</b>. Puedes cambiarle el cliente, las líneas, los conceptos y las fechas mientras siga pendiente de cobro.`}</div>` : ''}
    <fieldset><legend>Cliente</legend>
      <label class="campo"><span>Traer los datos de</span>
        <select id="origen-fac" name="origen">
          <option value="">${f?'Dejar los de la factura':'Escribirlos a mano'}</option>
          ${asos.length?`<optgroup label="Asociados">${asos.map(a=>`<option value="aso:${esc(a.id)}">${esc(a.nombre)}</option>`).join('')}</optgroup>`:''}
          ${clis.length?`<optgroup label="Clientes externos">${clis.map(c=>`<option value="cli:${esc(c.id)}">${esc(c.nombre)}</option>`).join('')}</optgroup>`:''}
        </select></label>
      <p class="ayuda">Elige a quién facturar para rellenar la ficha, o escribe los datos directamente si no está en la base de datos. Lo que quede escrito aquí es lo que sale impreso, aunque no coincida con la ficha: cambiarlo no toca la ficha del asociado.</p>
      <label class="campo"><span>Razón social</span><input name="nombre" id="nombre-fac" value="${v('nombre')}" required></label>
      <div class="rejilla">
        <label class="campo"><span>CIF / NIF</span><input name="cif" id="cif-fac" class="mono" value="${v('cif')}" required></label>
        <label class="campo"><span>Correo</span><input name="email" id="email-fac" type="email" value="${v('email')}"></label>
      </div>
      <label class="campo"><span>Vía</span><input name="via" id="via-fac" value="${v('via')}"></label>
      <div class="rejilla">
        <label class="campo"><span>C.P.</span><input name="cp" id="cp-fac" class="mono" value="${v('cp')}"></label>
        <label class="campo"><span>Localidad</span><input name="loc" id="loc-fac" value="${v('loc')}"></label>
        <label class="campo"><span>Provincia</span><input name="prov" id="prov-fac" value="${v('prov')}"></label>
      </div>
      <label class="check"><input type="checkbox" name="guardarCli" id="guardar-cli-fac">
        <span>Guardar estos datos en Clientes externos para la próxima vez</span></label>
    </fieldset>
    <fieldset><legend>Documento</legend>
      <div class="rejilla">
        <label class="campo"><span>Fecha</span><input name="fecha" type="date" value="${f?esc(f.fecha):hoy()}" required></label>
        <label class="campo"><span>Vencimiento</span><input name="vto" type="date" value="${f?esc(f.vto||f.fecha):hoy()}"></label>
        <label class="campo"><span>Periodo (opcional)</span><input name="periodo" value="${v('periodo')}" placeholder="4T 2026, Ejercicio 2026…"></label>
      </div>
    </fieldset>
    <fieldset><legend>Líneas</legend>
      <div class="tabla-caja"><table class="t-lineas">
        <thead><tr><th>Concepto</th><th class="num">Uds.</th><th class="num">Precio €</th><th>IVA</th><th class="num">Base</th><th></th></tr></thead>
        <tbody id="lineas-fac"></tbody>
      </table></div>
      <p class="ayuda"><button type="button" class="mini" data-add-linea>+ Añadir otra línea</button> · escribe el concepto que quieras en cada línea; cada una lleva su propio tipo de IVA.</p>
      <div class="totales-fac" id="totales-fac"></div>
    </fieldset>
    <fieldset><legend>Otros datos</legend>
      <label class="campo"><span>Régimen de IVA (solo se imprime si ninguna línea lleva IVA)</span><input name="regimen" value="${f?esc(f.regimen||S.config.regimenCuota):esc(S.config.regimenCuota)}"></label>
      <label class="campo"><span>Observaciones</span><textarea name="obs" rows="2">${v('obs')}</textarea></label>
    </fieldset>
   </form>`,
   f ? `<button class="btn" data-cerrar>Cancelar</button><button class="btn pri" data-guardar-fac="${esc(f.id)}">Guardar cambios</button>`
     : `<button class="btn" data-cerrar>Cancelar</button><button class="btn pri" data-crear-fac>Emitir factura</button>`, true);
  pintarLineas();
}

/* ---------- nueva remesa ---------- */
function panelNuevaRemesa(){
  const c = S.config;
  const pend = S.facturas.filter(f=>!f.estado || f.estado==='Pendiente' || f.estado==='Devuelta');
  const dentro = [], fuera = [];
  for(const f of pend){
    const a = asoDe(f);
    if(!a) fuera.push({f, por: f.tipoCliente==='externo' ? 'Cliente externo: se cobra fuera de la remesa' : 'No hay ficha de asociado con ese CIF'});
    else if(a.activo===false) fuera.push({f, por:'Asociado de baja'});
    else if(a.forma!=='Recibo domiciliado') fuera.push({f, por:'Cobra por transferencia'});
    else if(!ibanValido(a.iban)) fuera.push({f, por:a.iban?'IBAN no válido':'Sin IBAN en la ficha'});
    else dentro.push({f, a});
  }
  const suma = r2(dentro.reduce((s,x)=>s+(+x.f.total||0),0));
  const avisoId = !c.idAcreedor || c.idAcreedor !== idAcreedor(c.cif,c.sufijo);
  const sinFirma = dentro.filter(({a})=>!a.fechaMandato).map(({a})=>a.nombre);
  abrirPanel('Nueva remesa de adeudos', `
   ${!ibanValido(c.ibanCargo)?`<div class="aviso-caja err"><b>Falta la cuenta de abono.</b> Ponla en Ajustes antes de generar el fichero.</div>`:''}
   <div class="aviso-caja"><b>Antes de enviarla al banco.</b> Comprueba en Ajustes que el identificador del acreedor
     <span class="mono">${esc(c.idAcreedor||'—')}</span> es el que ${esc(S.config.nombreCorto||ENT)} tiene dado de alta${avisoId?' (ahora mismo no coincide con el calculado a partir del CIF)':''}.</div>
   ${sinFirma.length?`<div class="aviso-caja"><b>Mandatos sin fecha de firma.</b> ${sinFirma.length} asociado${sinFirma.length>1?'s':''} no tiene${sinFirma.length>1?'n':''} fecha de firma del mandato en su ficha: el fichero llevará la fecha de cargo en su lugar. Compl&eacute;tala en la ficha si el banco te la reclama. ${sinFirma.slice(0,6).map(n=>esc(n)).join(' · ')}${sinFirma.length>6?` y ${sinFirma.length-6} más`:''}.</div>`:''}
   <form id="form-remesa">
    <div class="rejilla">
      <label class="campo"><span>Fecha de cargo</span><input name="fechaCargo" type="date" value="${hoy()}" required></label>
      <label class="campo"><span>Cuenta de abono</span><input value="${esc(ibanBonito(c.ibanCargo))}" class="mono" readonly></label>
    </div>
    <fieldset><legend>Recibos a incluir · ${dentro.length}</legend>
      ${dentro.length?`<div class="lista-sel">
        ${dentro.map(({f,a})=>`<label class="check"><input type="checkbox" name="sel" value="${esc(f.id)}" checked>
          <span style="flex:1">${esc(f.nombre)} <span class="dim mono">${esc(f.num)}</span></span>
          <span class="mono num" style="min-width:86px">${eur(f.total)}</span>
          <span class="pill gris">${esc(a.secuencia||'RCUR')}</span></label>`).join('')}
      </div>
      <p class="ayuda">${dentro.length} adeudos por <b>${eur(suma)}</b>.</p>`
      :`<p class="vacio" style="padding:18px">No hay recibos domiciliados pendientes.</p>`}
    </fieldset>
    ${fuera.length?`<fieldset><legend>Quedan fuera · ${fuera.length}</legend>
      <div class="tabla-caja"><table><thead><tr><th>Nº</th><th>Cliente</th><th class="num">Importe</th><th>Motivo</th></tr></thead>
      <tbody>${fuera.map(({f,por})=>`<tr><td class="mono">${esc(f.num)}</td><td>${esc(f.nombre)}</td>
        <td class="num mono">${eur(f.total)}</td><td class="dim">${esc(por)}</td></tr>`).join('')}</tbody></table></div>
    </fieldset>`:''}
   </form>`,
   `<button class="btn" data-cerrar>Cancelar</button>
    <button class="btn pri" data-crear-remesa ${dentro.length&&ibanValido(c.ibanCargo)?'':'disabled'}>Generar remesa</button>`, true);
}

  const r = S.remesas.find(x=>x.id===id); if(!r) return;
  const lineas = r.lineas||[];
  abrirPanel(r.nombre||('Remesa '+id), `
    <dl class="tiles">

      <Cdtr><Nm>${xesc(sepaTxt(c.nombre,70))}</Nm>${dirEmisor}</Cdtr>
      <CdtrAcct><Id><IBAN>${xesc(ibanLimpio(r.ibanCargo))}</IBAN></Id></CdtrAcct>
      <CdtrAgt><FinInstnId><BIC>${xesc(c.bic||'NOTPROVIDED')}</BIC></FinInstnId></CdtrAgt>

      <CdtrSchmeId><Id><PrvtId><Othr><Id>${xesc(r.idAcreedor)}</Id><SchmeNm><Prtry>SEPA</Prtry></SchmeNm></Othr></PrvtId></Id></CdtrSchmeId>${tx}

<Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.008.001.02" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">

function csvRemesa(r){
  const cab = ['Nº FRA.','DEUDOR','CIF','IBAN','MANDATO','SECUENCIA','CONCEPTO','IMPORTE'];
  const filas = (r.lineas||[]).map(l=>[l.num,l.nombre,l.cif,ibanBonito(l.iban),l.mandato,l.secuencia,l.concepto,num2(l.importe)]);
  filas.push(['','','','','','','TOTAL', num2(r.importe)]);
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  return '﻿' + [cab,...filas].map(f=>f.map(q).join(';')).join('\r\n');
}
function csvTabla(cab, filas){
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  return '﻿' + [cab,...filas].map(f=>f.map(q).join(';')).join('\r\n');
}
async function descargar(nombre, datos){
  try{
    const blob = datos instanceof Blob ? datos
      : new Blob([datos], {type:/\.csv$/i.test(nombre) ? 'text/csv;charset=utf-8' : 'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 2000);
    brindis('Descargado: '+nombre);
  }catch(e){ brindis('No se ha podido descargar el fichero.'); }
}
function pdfFactura(f){
  const J = window.jspdf && window.jspdf.jsPDF;
  if(!J){ brindis('No se ha podido cargar el generador de PDF.'); return null; }
  const c = S.config, doc = new J({unit:'mm', format:'a4'});
  const M = 20, W = 210, der = W - M;
  const gris = () => doc.setTextColor(102,102,102), negro = () => doc.setTextColor(26,26,26);
  const lg = logoActual();
  if(lg){ try{ doc.addImage(lg, /jpe?g/i.test(lg.slice(0,30))?'JPEG':'PNG', der - 60, 8.7, 60, 13.3); }catch(e){} }
  let y = 26;
  doc.setFont('helvetica','bold'); negro(); doc.setFontSize(20);
  doc.text('Factura', M, y); y += 11;
  doc.setFontSize(9);
  [['Número #', f.num],['Fecha', fechaES(f.fecha)],['Vencimiento', fechaES(f.vto)]].forEach(([k,v])=>{
    doc.setFont('helvetica','bold'); negro(); doc.text(k, M, y);
    doc.setFont('helvetica','normal'); doc.text(String(v), M+34, y); y += 5;
  });
  y += 10;
  const yBloque = y;
  doc.setFontSize(9.5); negro();
  const izq = [c.nombre, c.via, `${c.loc} (${c.cp}), ${c.prov}, ${c.pais}`, c.cif, '', c.email];
  let yi = yBloque;
  izq.forEach(l=>{ doc.text(doc.splitTextToSize(String(l||''), 78), M, yi); yi += (String(l||'').length>44?8:4.8); });
  const xC = M + 88;
  gris(); doc.setFontSize(8.5); doc.text('Cliente', xC, yBloque);
  negro(); doc.setFontSize(9.5);
  let yd = yBloque + 5.5;
  const dcl = [f.nombre, f.via, [f.loc, f.cp?`(${f.cp})`:''].filter(Boolean).join(' ') + (f.prov?`, ${f.prov}, España`:''), f.cif];
  dcl.filter(Boolean).forEach(l=>{ const w = doc.splitTextToSize(String(l), 72); doc.text(w, xC, yd); yd += w.length*4.6; });
  y = Math.max(yi, yd) + 12;

  const L = lineasDe(f), T = totalesDe(L);
  let pag = 1;
  const cabeceraTabla = () => {
    doc.setFont('helvetica','normal'); doc.setFontSize(8); gris();
    doc.text('CONCEPTO', M, y); doc.text('PRECIO', M+86, y, {align:'right'});
    doc.text('UNIDADES', M+112, y, {align:'right'}); doc.text('IVA', M+132, y, {align:'right'});
    doc.text('SUBTOTAL', der, y, {align:'right'});
    y += 2; doc.setDrawColor(153); doc.setLineWidth(.2); doc.line(M, y, der, y); y += 6;
    negro(); doc.setFontSize(9.5);
  };
  const otraPagina = conCabecera => { doc.addPage(); pag++; y = 26; if(conCabecera) cabeceraTabla(); else { negro(); doc.setFontSize(9.5); } };
  cabeceraTabla();
  for(const l of L){
    const txt = doc.splitTextToSize(String(l.concepto||''), 76);
    const alto = Math.max(5, txt.length*4.6);
    if(y + alto > 258) otraPagina(true);
    doc.text(txt, M, y);
    doc.text(eur(l.precio), M+86, y, {align:'right'});
    doc.text(num2(l.uds), M+112, y, {align:'right'});
    doc.text(l.tipoIva?l.tipoIva+' %':'—', M+132, y, {align:'right'});
    doc.text(eur(l.base), der, y, {align:'right'});
    y += alto; doc.setDrawColor(230); doc.line(M, y, der, y); y += 6;
  }
  y += 6;

  const xt = M + 96;
  const fila = (k,v,fuerte)=>{ doc.setFont('helvetica', fuerte?'bold':'normal');
    doc.text(k, xt, y); doc.text(v, der, y, {align:'right'});
    y += 3; doc.setDrawColor(fuerte?153:230); doc.line(xt, y, der, y); y += 6; };
  if(y + 9*(2+T.porTipo.length) > 262) otraPagina(false);
  doc.setFontSize(9.5); negro();
  fila('BASE IMPONIBLE', eur(T.base), false);
  T.porTipo.forEach(g=>fila(`IVA ${g.tipo} % sobre ${eur(g.base)}`, eur(g.iva), false));
  fila('TOTAL', eur(T.total), true);
  doc.setFont('helvetica','normal');
  if(f.regimen && !T.iva){ gris(); doc.setFontSize(8); doc.text(String(f.regimen), M, y+4); }

  for(let p=1; p<=pag; p++){
    doc.setPage(p);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); gris(); doc.setDrawColor(221);
    doc.line(M, 276, der, 276);
    doc.text(`${f.num} - ${eur(T.total)} Vencimiento ${fechaES(f.vto)}`, M, 281);
    doc.text(`Pág. ${p} de ${pag}`, der, 281, {align:'right'});
  }
  return doc.output('blob');
}

async function crearFacturas(items){
  let n = siguienteNumero();
  const creadas = [];
  for(const it of items){ creadas.push({...it, num: numFactura(n)}); n++; }
  for(const f of creadas) await guardar('facturas/'+clave(f.num), f);
  await guardar(rutaConfig(ENT), {...S.config, siguiente:n});
  return creadas;
}
function facturaDesde(a, base, opts){
  const b = r2(base), tipo = +(opts.tipoIva||0), iva = r2(b*tipo/100), uds = opts.uds||1;
  return {
    num:'', fecha:opts.fecha, vto:opts.vto||opts.fecha,
    cif:a.cif, nombre:a.nombre, via:a.via||'', cp:a.cp||'', loc:a.loc||'', prov:a.prov||'', email:a.email||'',
    tipoCliente:'asociado',
    lineas:[{concepto:opts.concepto, uds, precio:r2(b/uds), tipoIva:tipo}],
    concepto:opts.concepto, periodo:opts.periodo||'',
    precio:r2(b/uds), uds,
    base:b, tipoIva:tipo, iva, total:r2(b+iva),
    regimen:opts.regimen||'', estado:'Pendiente', fcobro:'', banco:'', formaCobro:'',
    remesaId:'', obs:opts.obs||'', creada: new Date().toISOString()
  };
}
/* Factura con cliente escrito a mano y una o varias líneas.
   Se guardan también los campos agregados de siempre (concepto, base, tipoIva, iva, total)
   para que remesas, CSV y devoluciones sigan funcionando igual. */
function facturaMulti(cl, lineas, opts){
  const L = lineas.map(normLinea), T = totalesDe(L), uno = L.length===1 ? L[0] : null;
  return {
    num:'', fecha:opts.fecha, vto:opts.vto||opts.fecha,
    cif:cl.cif||'', nombre:cl.nombre||'', via:cl.via||'', cp:cl.cp||'', loc:cl.loc||'', prov:cl.prov||'', email:cl.email||'',
    tipoCliente:opts.tipoCliente||'externo',
    lineas: L.map(l=>({concepto:l.concepto, uds:l.uds, precio:l.precio, tipoIva:l.tipoIva})),
    concepto: uno ? uno.concepto : L.map(l=>l.concepto).join(' · '),
    periodo: opts.periodo||'',
    precio: uno ? uno.precio : T.base, uds: uno ? uno.uds : 1,
    base: T.base,
    tipoIva: uno ? uno.tipoIva
           : (T.porTipo.length===1 && L.every(l=>l.tipoIva===T.porTipo[0].tipo) ? T.porTipo[0].tipo : 0),
    iva: T.iva, total: T.total,
    regimen: opts.regimen||'', estado:'Pendiente', fcobro:'', banco:'', formaCobro:'',
    remesaId:'', obs:opts.obs||'', creada: new Date().toISOString()
  };
}

    });
    return descargar(`Facturas emitidas ${S.config.nombreCorto||ENT}.csv`,
      csvTabla(['Nº FRA.','F. FRA.','F. VTO.','CLIENTE','CIF','TIPO','CONCEPTO','Nº LÍNEAS','BASE','% IVA','IVA','TOTAL','ESTADO','F. COBRO','BANCO','REMESA'], filas));
  }

  if(t.hasAttribute('data-quitar-logo')){
    if(!confirm('¿Quitar el logo de '+ENT+'? Las facturas saldrán sin él.')) return;
    if(await guardar(rutaConfig(ENT), {...S.config, logo:''})) brindis('Logo quitado.');
    return;
  }
  if(t.hasAttribute('data-nueva-ent')){
    const bruto = prompt('Nombre corto de la asociación (sin espacios ni acentos, p. ej. ASEFACOL):');
    if(bruto===null) return;
    const nom = String(bruto).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toUpperCase().replace(/[^A-Z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,24);
    if(!nom){ brindis('Ese nombre no vale: usa letras y números.'); return; }
    if(entidades().includes(nom)){ brindis(nom+' ya está dada de alta: elígela en el desplegable.'); return; }
    const ok = await guardar('config/'+nom, {...CONFIG_BASE, nombre:nom, nombreCorto:nom,
      serie:nom.slice(0,1)+'26', siguiente:1});
    if(ok){ ENT = nom; refrescar(); vista='ajustes'; pintar(); brindis(nom+' dada de alta. Rellena sus datos aquí.'); }
    return;
  }
  if(t.dataset.editarAso) return panelAsociado(t.dataset.editarAso);
  if(t.dataset.editarCli) return panelCliente(t.dataset.editarCli);
  if(t.hasAttribute('data-add-linea')){ leerLineas(); lineasFac.push(lineaVacia()); pintarLineas(); return; }
  if(t.dataset.delLinea){ leerLineas(); lineasFac.splice(+t.dataset.delLinea, 1);
    if(!lineasFac.length) lineasFac = [lineaVacia()]; pintarLineas(); return; }
  if(t.dataset.editarFac) return panelFactura(t.dataset.editarFac);
  if(t.dataset.verFac) return panelVerFactura(t.dataset.verFac);
  if(t.dataset.cobroFac) return panelCobro(t.dataset.cobroFac);
  if(t.dataset.verRemesa) return panelVerRemesa(t.dataset.verRemesa);
  if(t.dataset.editarDevol) return panelDevolucion(t.dataset.editarDevol);

  /* --- guardar asociado --- */
  if(t.hasAttribute('data-guardar-aso')){
    const form = document.getElementById('form-aso');
    if(!form.reportValidity()) return;
    const d = datosForm(form);
    const id = form.dataset.id || clave(d.cif);
    const prev = S.asociados.find(x=>x.id===id) || {};
    const ok = await guardar('asociados/'+id, {...prev,
      ref:d.ref, nombre:d.nombre, cif:d.cif, email:d.email, via:d.via, cp:d.cp, loc:d.loc, prov:d.prov, pais:'España',
      iban:ibanLimpio(d.iban), forma:d.forma, cuota:+d.cuota||0, cuotaAnual:+d.cuotaAnual||0,
      periodicidad:d.periodicidad||'Trimestral', notaCuota:d.notaCuota||'',
      trimestres:[...form.querySelectorAll('input[name="trim"]:checked')].map(i=>+i.value),
      mandato:d.mandato||d.cif, fechaMandato:d.fechaMandato, secuencia:d.secuencia,
      activo:d.activo==='1', obs:d.obs});
    if(ok){ cerrarPanel(); brindis('Ficha guardada.'); }
    return;
  }
  /* --- guardar cliente externo --- */
  if(t.hasAttribute('data-guardar-cli')){
    const form = document.getElementById('form-cli');
    if(!form.reportValidity()) return;
    const d = datosForm(form);
    if(S.asociados.some(a=>a.cif===d.cif)){ brindis('Ese CIF ya es de un asociado: usa su ficha de asociado.'); return; }
    const id = form.dataset.id || clave(d.cif);
    const prev = S.clientes.find(x=>x.id===id) || {};
    const ok = await guardar('clientes/'+id, {...prev, nombre:d.nombre, cif:d.cif, email:d.email,
      via:d.via, cp:d.cp, loc:d.loc, prov:d.prov, pais:d.pais||'España', obs:d.obs});
    if(ok){ cerrarPanel(); brindis('Cliente guardado.'); }
    return;
  }
  if(t.dataset.borrarCli){
    if(!confirm('¿Eliminar esta ficha de cliente? Las facturas ya emitidas se conservan.')) return;
    if(await borrar('clientes/'+t.dataset.borrarCli)){ cerrarPanel(); brindis('Cliente eliminado.'); }
    return;
  }

  if(t.dataset.borrarAso){
    if(!confirm('¿Eliminar la ficha de este asociado? Las facturas ya emitidas se conservan.')) return;
    if(await borrar('asociados/'+t.dataset.borrarAso)){ cerrarPanel(); brindis('Ficha eliminada.'); }
    return;
  }

  /* --- emitir cuotas --- */
  if(t.hasAttribute('data-emitir-cuotas')){
    const form = document.getElementById('form-cuotas');
    if(!form.reportValidity()) return;
    const d = datosForm(form);
    const sel = [...form.querySelectorAll('input[name="sel"]:checked')].map(i=>i.value);
    if(!sel.length){ brindis('No has marcado ningún asociado.'); return; }
    t.disabled = true; t.textContent = 'Emitiendo…';
    const modo = form.dataset.modo || 'Trimestral';
    const periodo = modo==='Anual' ? `Ejercicio ${d.fecha.slice(0,4)}` : `${d.trim}T ${d.fecha.slice(0,4)}`;
    const items = sel.map(id=>{
      const a = S.asociados.find(x=>x.id===id);
      return facturaDesde(a, cuotaDe(a,modo), {fecha:d.fecha, vto:d.vto, concepto:d.concepto,
        periodo, tipoIva:0, regimen:d.regimen, uds:1, obs:a.notaCuota||''});
    });
    const creadas = await crearFacturas(items);
    cerrarPanel(); vista='facturas'; pintar();
    brindis(`${creadas.length} facturas emitidas: ${creadas[0].num} a ${creadas[creadas.length-1].num}.`);
    return;
  }

  /* --- factura suelta --- */
  if(t.hasAttribute('data-crear-fac')){
    const form = document.getElementById('form-fac-suelta');
    if(!form.reportValidity()) return;
    const d = datosForm(form);
    const L = leerLineas().map(normLinea).filter(l=>l.concepto || l.base);
    if(!L.length){ brindis('Añade al menos una línea con concepto e importe.'); return; }
    if(L.some(l=>!l.concepto)){ brindis('Hay alguna línea sin concepto.'); return; }
    const T = totalesDe(L);
    if(!T.total){ brindis('El total de la factura sale a cero: revisa los precios.'); return; }
    const esAso = S.asociados.some(a=>a.cif===d.cif);
    const cl = {nombre:d.nombre, cif:d.cif, via:d.via, cp:d.cp, loc:d.loc, prov:d.prov, email:d.email};
    const chk = form.elements.guardarCli;
    if(chk && chk.checked && !chk.disabled && d.cif && !esAso){
      const prev = S.clientes.find(x=>x.cif===d.cif) || {};
      await guardar('clientes/'+clave(d.cif), {...prev, ...cl, pais:'España', obs:prev.obs||''});
    }
    const creadas = await crearFacturas([facturaMulti(cl, L, {fecha:d.fecha, vto:d.vto||d.fecha,
      periodo:d.periodo||'', regimen: T.iva?'':d.regimen, obs:d.obs,
      tipoCliente: esAso?'asociado':'externo'})]);
    cerrarPanel(); vista='facturas'; pintar();
    brindis(`Factura ${creadas[0].num} emitida por ${eur(creadas[0].total)}.`);
    return;
  }

  /* --- guardar los cambios de una factura ya emitida --- */
  if(t.dataset.guardarFac){
    const prev = S.facturas.find(x=>x.id===t.dataset.guardarFac); if(!prev) return;
    const form = document.getElementById('form-fac-suelta');
    if(!form.reportValidity()) return;
    const d = datosForm(form);
    const L = leerLineas().map(normLinea).filter(l=>l.concepto || l.base);
    if(!L.length){ brindis('Añade al menos una línea con concepto e importe.'); return; }
    if(L.some(l=>!l.concepto)){ brindis('Hay alguna línea sin concepto.'); return; }
    const T = totalesDe(L);
    if(!T.total){ brindis('El total de la factura sale a cero: revisa los precios.'); return; }
    if(prev.remesaId && r2(+prev.total||0)!==T.total &&
       !confirm(`Esta factura está en la remesa ${prev.remesaId} por ${eur(prev.total)}. Si cambias el importe a ${eur(T.total)}, la remesa ya generada sigue con el importe antiguo. ¿Sigo?`)) return;
    const esAso = S.asociados.some(a=>a.cif===d.cif);
    const cl = {nombre:d.nombre, cif:d.cif, via:d.via, cp:d.cp, loc:d.loc, prov:d.prov, email:d.email};
    const chk = form.elements.guardarCli;
    if(chk && chk.checked && !chk.disabled && d.cif && !esAso){
      const c0 = S.clientes.find(x=>x.cif===d.cif) || {};
      await guardar('clientes/'+clave(d.cif), {...c0, ...cl, pais:'España', obs:c0.obs||''});
    }
    const nueva = facturaMulti(cl, L, {fecha:d.fecha, vto:d.vto||d.fecha, periodo:d.periodo||'',
      regimen: T.iva?'':d.regimen, obs:d.obs, tipoCliente: esAso?'asociado':'externo'});
    const ok = await guardar('facturas/'+prev.id, {...prev, ...nueva,
      num:prev.num, estado:prev.estado||'Pendiente', fcobro:prev.fcobro||'', banco:prev.banco||'',
      formaCobro:prev.formaCobro||'', remesaId:prev.remesaId||'', creada:prev.creada||'',
      modificada:new Date().toISOString()});
    if(ok){ cerrarPanel(); brindis(`Factura ${prev.num} actualizada: ${eur(nueva.total)}.`); }
    return;
  }

  /* --- cobro --- */
  if(t.hasAttribute('data-guardar-cobro')){
    const form = document.getElementById('form-cobro');
    const d = datosForm(form);
    const f = S.facturas.find(x=>x.id===form.dataset.id); if(!f) return;
    await guardar('facturas/'+f.id, {...f, estado:d.estado, fcobro:d.fcobro, banco:d.banco, formaCobro:d.formaCobro, obs:d.obs});
    cerrarPanel(); brindis('Cobro actualizado.');
    return;
  }
  if(t.dataset.anularFac){
    if(!confirm('¿Anular esta factura? Se queda en el listado como Anulada y su número no se reutiliza.')) return;
    const f = S.facturas.find(x=>x.id===t.dataset.anularFac); if(!f) return;
    await guardar('facturas/'+f.id, {...f, estado:'Anulada'});
    cerrarPanel(); brindis('Factura anulada.');
    return;
  }
  if(t.dataset.pdfFac){
    const f = S.facturas.find(x=>x.id===t.dataset.pdfFac); if(!f) return;
    const blob = pdfFactura(f);
    if(blob) await descargar(`${f.num} ${sepaTxt(f.nombre,40)}.pdf`, blob);
    return;
  }

  /* --- crear remesa --- */
  if(t.hasAttribute('data-crear-remesa')){
    const form = document.getElementById('form-remesa');
    if(!form.reportValidity()) return;
    const d = datosForm(form);
    const sel = [...form.querySelectorAll('input[name="sel"]:checked')].map(i=>i.value);
    if(!sel.length){ brindis('No has marcado ningún recibo.'); return; }
    t.disabled = true; t.textContent = 'Generando…';
    const c = S.config;
    const lineas = sel.map(id=>{
      const f = S.facturas.find(x=>x.id===id), a = asoDe(f);
      return {num:f.num, cif:f.cif, nombre:f.nombre, iban:ibanLimpio(a.iban),
        mandato:a.mandato||a.cif, fechaMandato:a.fechaMandato||'',
        secuencia:a.secuencia||'RCUR', concepto:f.concepto, importe:+f.total||0,
        dir:[a.via,a.cp,a.loc].filter(Boolean).join(' ')};
    });
    const [aa,mm,dd] = d.fechaCargo.split('-');
    const id = clave(`REMESA-SEPA-${dd}-${mm}-${aa}`);   // sin espacios: es el id del documento
    const pre = ENT===ENT_BASE ? '' : ENT+' ';
    const nombre = `${pre}REMESA SEPA ${dd}-${mm}-${aa}`; // el nombre visible y el del fichero
    const remesa = {nombre, fechaCargo:d.fechaCargo, ibanCargo:c.ibanCargo, bic:c.bic,
      idAcreedor:c.idAcreedor, lineas, importe:r2(lineas.reduce((s,l)=>s+l.importe,0)),
      secuencias:[...new Set(lineas.map(l=>l.secuencia))], estado:'Enviada', creada:new Date().toISOString()};
    await guardar('remesas/'+id, remesa);
    for(const l of lineas){
      const f = S.facturas.find(x=>x.num===l.num);
      await guardar('facturas/'+f.id, {...f, estado:'En remesa', remesaId:id, formaCobro:'Recibo domiciliado'});
    }
    /* los primeros adeudos pasan a sucesivos */
    for(const l of lineas.filter(l=>l.secuencia==='FRST')){
      const a = S.asociados.find(x=>x.cif===l.cif);
      if(a) await guardar('asociados/'+a.id, {...a, secuencia:'RCUR'});
    }
    cerrarPanel(); vista='remesas'; pintar();
    brindis(`Remesa creada: ${lineas.length} adeudos por ${eur(remesa.importe)}.`);
    setTimeout(()=>panelVerRemesa(id), 300);
    return;
  }
  if(t.dataset.xmlRemesa){
    const r = S.remesas.find(x=>x.id===t.dataset.xmlRemesa); if(!r) return;
    const xml = construirXmlAdeudos(r);
    await descargar(r.nombre+'.zip', zip([{nombre:r.nombre+'.xml', datos:xml}]));
    return;
  }
  if(t.dataset.csvRemesa){
    const r = S.remesas.find(x=>x.id===t.dataset.csvRemesa); if(!r) return;
    await descargar(r.nombre+'.csv', csvRemesa(r));
    return;
  }

  /* --- devolución --- */
  if(t.hasAttribute('data-guardar-devol')){
    const form = document.getElementById('form-devol');
    if(!form.reportValidity()) return;
    const d = datosForm(form);
    const id = form.dataset.id || clave('DEV-'+d.fecha.replace(/-/g,'')+'-'+String(Date.now()).slice(-4));
    const f = d.numFactura ? S.facturas.find(x=>x.num===d.numFactura) : null;
    const aIban = d.ibanDev ? S.asociados.find(x=>ibanLimpio(x.iban)===ibanLimpio(d.ibanDev)) : null;
    await guardar('devoluciones/'+id, {fecha:d.fecha, fechaValor:d.fechaValor, banco:d.banco,
      numFactura:d.numFactura, nombre:(f&&f.nombre)||d.nombre||(aIban?aIban.nombre:''),
      cif:(f&&f.cif)||(aIban?aIban.cif:''), ibanDev:ibanLimpio(d.ibanDev),
      importe:+d.importe||0, gastos:+d.gastos||0, estado:d.estado, obs:d.obs});
    if(f && d.estado!=='Recuperada') await guardar('facturas/'+f.id, {...f, estado:'Devuelta', fcobro:'', obs:(f.obs?f.obs+' · ':'')+'Recibo devuelto el '+fechaES(d.fecha)});
    if(f && d.estado==='Recuperada') await guardar('facturas/'+f.id, {...f, estado:'Cobrada'});
    cerrarPanel(); brindis('Devolución registrada.');
    return;
  }
  if(t.dataset.borrarDevol){
    if(!confirm('¿Eliminar este registro de devolución?')) return;
    if(await borrar('devoluciones/'+t.dataset.borrarDevol)){ cerrarPanel(); brindis('Devolución eliminada.'); }
    return;
  }
});

document.addEventListener('submit', async ev => {
  if(ev.target.id !== 'form-ajustes') return;
  ev.preventDefault();
  const d = datosForm(ev.target);
  const ok = await guardar(rutaConfig(ENT), {...S.config, ...d,
    ibanCargo: ibanLimpio(d.ibanCargo), siguiente: +d.siguiente || siguienteNumero()});
  if(ok) brindis('Ajustes guardados.');
});

document.addEventListener('input', ev => {
  const id = ev.target.id;
  if(ev.target.hasAttribute && ev.target.hasAttribute('data-linea')) return actualizarTotales();
  if(id==='iban-aso') return revisarIban();
  if(id==='iban-dev' || id==='importe-dev') return revisarDevolucion();
  if(id==='q-aso'){ filtros.aso.q = ev.target.value; const p=ev.target.selectionStart; pintar();
    const n=document.getElementById('q-aso'); if(n){n.focus(); n.setSelectionRange(p,p);} return; }
  if(id==='q-fac'){ filtros.fac.q = ev.target.value; const p=ev.target.selectionStart; pintar();
    const n=document.getElementById('q-fac'); if(n){n.focus(); n.setSelectionRange(p,p);} return; }
  if(id==='q-cli'){ filtros.cli.q = ev.target.value; const p=ev.target.selectionStart; pintar();
    const n=document.getElementById('q-cli'); if(n){n.focus(); n.setSelectionRange(p,p);} return; }
});
document.addEventListener('change', ev => {
  const id = ev.target.id;
  if(ev.target.hasAttribute && ev.target.hasAttribute('data-linea')) return actualizarTotales();
  if(id==='origen-fac'){
    const [k, ref] = String(ev.target.value||'').split(':');
    const o = k==='aso' ? S.asociados.find(x=>x.id===ref)
            : k==='cli' ? S.clientes.find(x=>x.id===ref) : null;
    const pon = (campo, val) => { const el = document.getElementById(campo+'-fac'); if(el) el.value = val || ''; };
    ['nombre','cif','email','via','cp','loc','prov'].forEach(c=>pon(c, o && o[c]));
    const chk = document.getElementById('guardar-cli-fac');
    if(chk){
      chk.disabled = (k==='aso');
      if(chk.disabled) chk.checked = false;
      const lab = chk.closest('label'); if(lab) lab.style.opacity = chk.disabled ? .45 : 1;
    }
    return;
  }
  if(id==='sel-ent'){
    const e = ev.target.value;
    if(e && e!==ENT){ ENT = e; cerrarPanel(); refrescar(); pintar(); brindis('Ahora estás en '+ENT+'.'); }
    return;
  }
  if(id==='logo-ajustes'){
    const file = ev.target.files && ev.target.files[0];
    if(!file) return;
    if(file.size > 300*1024){ brindis('El logo no puede pasar de 300 KB.'); ev.target.value=''; return; }
    const lector = new FileReader();
    lector.onload = async () => {
      const ok = await guardar(rutaConfig(ENT), {...S.config, logo:String(lector.result)});
      if(ok) brindis('Logo guardado.');
    };
    lector.readAsDataURL(file);
    return;
  }
  if(id==='forma-aso'){ filtros.aso.forma = ev.target.value; pintar(); }
  else if(id==='tipo-aso'){ filtros.aso.tipo = ev.target.value; pintar(); }
  else if(id==='estado-aso'){ filtros.aso.estado = ev.target.value; pintar(); }
  else if(id==='estado-fac'){ filtros.fac.estado = ev.target.value; pintar(); }
  else if(id==='trim-fac'){ filtros.fac.trim = ev.target.value; pintar(); }
  else if(id==='modo-cuotas' || id==='trim-cuotas'){
    const f = document.getElementById('form-cuotas');
    panelCuotas(f.elements.modo.value, f.elements.trim.value);
  }
  else if(id==='periodicidad-aso'){ /* solo informativo */ }
});
function ocultarAcceso(){
  const c = document.getElementById('acceso'); if(c) c.hidden = true;
  const a = document.getElementById('app'); if(a) a.hidden = false;
}
function pintarAcceso(html){
  const a = document.getElementById('app'); if(a) a.hidden = true;
  const c = document.getElementById('acceso');
  c.hidden = false; c.innerHTML = html;
}
function pantallaAcceso(aviso){
  pintarAcceso(`
    <form class="caja-acceso" id="form-acceso">
      <h1>Facturación</h1>
      <p class="dim">ANFALUM · ASEFACOL</p>
      <label class="campo"><span>Correo</span>
        <input name="email" type="email" required autocomplete="username" autofocus></label>
      <label class="campo"><span>Contraseña</span>
        <input name="clave" type="password" required autocomplete="current-password"></label>
      ${aviso?`<p class="ayuda mal">${esc(aviso)}</p>`:''}
      <button class="btn pri" type="submit" style="width:100%;text-align:center">Entrar</button>
      <p class="ayuda" style="margin:14px 0 0">No hay registro abierto: las altas se dan desde el panel de la base de datos.</p>
    </form>`);
}
function pantallaConfig(aviso){
  pintarAcceso(`
    <form class="caja-acceso" id="form-config">
      <h1>Primer arranque</h1>
      <p class="dim">Hace falta la base de datos donde se guarda todo.</p>
      <label class="campo"><span>URL del proyecto</span>
        <input name="url" required placeholder="https://xxxxxxxx.supabase.co" value="${esc(CFG.url)}"></label>
      <label class="campo"><span>Clave publicable</span>
        <input name="key" required placeholder="sb_publishable_… o eyJhbGciOi…" value="${esc(CFG.key)}"></label>
      ${aviso?`<p class="ayuda mal">${esc(aviso)}</p>`:''}
      <button class="btn pri" type="submit" style="width:100%;text-align:center">Guardar y entrar</button>
      <p class="ayuda" style="margin:14px 0 0">Se queda guardado en este navegador. La clave publicable está pensada para ir a la vista: lo que protege los datos es la contraseña de cada usuario.</p>
    </form>`);
}

document.addEventListener('submit', async ev => {
  if(ev.target.id === 'form-acceso'){
    ev.preventDefault();
    const d = datosForm(ev.target);
    const btn = ev.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Entrando…';
    const {error} = await sb.auth.signInWithPassword({email:d.email, password:d.clave});
    if(error){ pantallaAcceso(error.message==='Invalid login credentials'
        ? 'El correo o la contraseña no son correctos.' : error.message); return; }
    location.reload();
  }
  if(ev.target.id === 'form-config'){
    ev.preventDefault();
    const d = datosForm(ev.target);
    try{
      localStorage.setItem('sb_url', d.url.replace(/\/+$/,''));
      localStorage.setItem('sb_key', d.key);
    }catch(e){ pantallaConfig('Este navegador no deja guardar la configuración.'); return; }
    location.reload();
  }
});

document.addEventListener('keydown', ev => { if(ev.key==='Escape') cerrarPanel(); });

pintar();
arrancar();
})();
